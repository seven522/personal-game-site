<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>铁拳破阵 2.4 · IRON IMPACT</title>
  <!-- Source: seven522/iron-impact @ 423eacf253a334081bf3f99ebae97d017d926b09. station=1 embeds the game in the cartridge cabinet. -->
  <script>
    if (new URLSearchParams(location.search).get('station') === '1') {
      document.documentElement.classList.add('in-station');
      for (const type of ['selectstart', 'contextmenu', 'dragstart', 'dblclick']) {
        document.addEventListener(type, e => e.preventDefault(), true);
      }
      for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
        document.addEventListener(type, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
      }
      for (const type of ['touchstart', 'touchmove', 'touchend']) {
        document.addEventListener(type, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
      }
    }
  </script>
  <style>
    :root {
      --background: #090d16;
      --card: #111827;
      --card-border: #1f2937;
      --border: #334155;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #fb923c;
    }
    html.light {
      --background: #f8fafc;
      --card: #ffffff;
      --card-border: #e2e8f0;
      --border: #cbd5e1;
      --foreground: #0f172a;
      --muted-foreground: #475569;
      --primary: #ea580c;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .shell { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .row-left, .row-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .top-bar { padding-bottom: 8px; border-bottom: 1px solid var(--card-border); }
    .title { font-weight: 800; font-size: 14px; letter-spacing: 0.03em; }
    .badge { padding: 2px 8px; border-radius: 5px; background: var(--card); border: 1px solid var(--card-border); font-family: ui-monospace, monospace; color: var(--muted-foreground); }
    .mono { font-family: ui-monospace, monospace; color: var(--muted-foreground); }
    .btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card); color: var(--foreground); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: border-color 120ms ease, transform 80ms ease;
    }
    .btn:hover { border-color: var(--primary); }
    .btn:active { transform: scale(0.97); }
    select.btn { padding: 3px 8px; outline: none; }
    .stage {
      position: relative; width: 100%; aspect-ratio: 920 / 350; min-height: 320px; max-height: 440px;
      border-radius: 10px; overflow: hidden; border: 1px solid var(--card-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    canvas:focus { outline: none; }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer; transition: opacity 200ms ease;
      background: rgba(10, 12, 18, 0.56); backdrop-filter: blur(2px);
    }
    .overlay-cta {
      padding: 10px 18px; border-radius: 8px; border: 1px solid var(--primary);
      background: var(--card); color: var(--foreground); font-weight: 700; font-size: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .overlay-sub {
      font-size: 12px; padding: 6px 12px; border-radius: 6px; background: var(--card);
      color: var(--muted-foreground); border: 1px solid var(--card-border); text-align: center; line-height: 1.6;
    }
    .hidden { display: none !important; }
    .focus-hint {
      position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 5px; font-size: 12px;
      background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); pointer-events: none;
    }
    .kbd {
      display: inline-flex; align-items: center; justify-content: center; min-width: 1.3rem; height: 1.25rem;
      padding: 0 0.3rem; font-size: 11px; font-weight: 700; border-radius: 4px;
      border: 1px solid var(--border); background: var(--card); color: var(--foreground); line-height: 1; margin: 0 1px;
    }
    .controls-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted-foreground); }
    .controls-legend strong { color: var(--foreground); }
    .lab-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid var(--card-border); font-size: 12px; }
    .lab-label { color: var(--muted-foreground); font-weight: 600; }
    .toggle-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
      font-size: 11.5px; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground);
      cursor: pointer; transition: all 120ms ease;
    }
    .toggle-pill[data-on="true"] { border-color: var(--primary); color: var(--foreground); box-shadow: inset 0 0 0 1px var(--primary); }
    .toggle-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--muted-foreground); opacity: 0.45; }
    .toggle-pill[data-on="true"] .toggle-dot { background: var(--primary); opacity: 1; }
    .build-text { margin-left: auto; color: var(--muted-foreground); font-family: ui-monospace, monospace; }
    .in-station, .in-station body {height:100%;min-height:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
    .in-station * {-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    .in-station body {padding:0;background:#090d16}
    .in-station .shell {width:min(100vw,262.85vh);max-width:none;display:block}
    .in-station .shell > :not(.stage), .in-station #focus-hint {display:none}
    .in-station .stage {min-height:0;max-height:none;border:0;border-radius:0;box-shadow:none}
    .in-station canvas {touch-action:none}
  </style>
</head>
<body>
  <div class="shell">
    <div class="row top-bar">
      <div class="row-left">
        <span class="title">铁拳破阵 2.4 · IRON IMPACT</span>

        <span><span class="kbd">W</span> 跳</span>
        <span><span class="kbd">J</span> 3连/飞膝</span>
        <span><span class="kbd">K</span> 挑飞/下砸/<strong>长按破盾</strong></span>
        <span><span class="kbd">L</span> 闪避</span>

      </div>
      <div class="row-right">
        <button id="act-j" class="btn">轻 J</button>
        <button id="act-k" class="btn">重/蓄 K</button>

    <div class="lab-bar">
      <span class="lab-label">打击感开关:</span>
      <button class="toggle-pill" data-feel="hitstop" data-on="true"><span class="toggle-dot"></span>顿帧</button>
      <button class="toggle-pill" data-feel="shake" data-on="true"><span class="toggle-dot"></span>震屏缩放</button>
      <button class="toggle-pill" data-feel="squash" data-on="true"><span class="toggle-dot"></span>形变</button>
      <button class="toggle-pill" data-feel="vfx" data-on="true"><span class="toggle-dot"></span>特效</button>
      <button class="toggle-pill" data-feel="sfx" data-on="true"><span class="toggle-dot"></span>音效</button>
      <span id="build-summary" class="build-text">打爆油桶/过关选强化词条</span>
    </div>
  </div>

<script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('start-overlay');
    const focusHint = document.getElementById('focus-hint');
    const hudWave = document.getElementById('hud-wave');
    const hudScore = document.getElementById('hud-score');
    const hudBest = document.getElementById('hud-best');
    const buildSummary = document.getElementById('build-summary');
    const btnMode = document.getElementById('btn-mode');
    const bossSelect = document.getElementById('boss-select');
    const btnBiome = document.getElementById('btn-biome');
    const btnReset = document.getElementById('btn-reset');

    const W = 920;
    const H = 350;
    const GROUND_Y = 290;
    const WALL_L = 34;
    const WALL_R = W - 34;
    const GRAVITY = 1580;

    const feel = { hitstop: true, shake: true, squash: true, vfx: true, sfx: true };

    // ==================== Theme & Stage Biomes ====================
    let isLightTheme = false;
    function updateThemeFlag() {
      isLightTheme = document.documentElement.classList.contains('light');
    }
    updateThemeFlag();
    window.addEventListener('themechange', updateThemeFlag);

    let forcedBiome = -1; // -1 = auto by wave
    function getBiome(w) {
      if (forcedBiome >= 0) return forcedBiome;
      if (mode === 'dummy') return 2;
      if (w % 3 === 0) return 1; // Boss Steel Cage
      return (Math.floor((w - 1) / 3) + (w % 3 === 2 ? 1 : 0)) % 2 === 0 ? 0 : 2;
    }

    const BIOME_NAMES = ['霓虹雨巷', '烈焰铁笼', '残阳古道场'];
    // Deterministic skyline & mountain geometry for smooth parallax
    const SKYLINE = [
      { x: -40, w: 78, h: 155, win: '#38bdf8' }, { x: 42, w: 64, h: 118, win: '#fbbf24' },
      { x: 112, w: 92, h: 182, win: '#f472b6' }, { x: 212, w: 68, h: 130, win: '#38bdf8' },
      { x: 288, w: 102, h: 196, win: '#fbbf24' }, { x: 400, w: 74, h: 144, win: '#38bdf8' },
      { x: 484, w: 88, h: 175, win: '#f472b6' }, { x: 582, w: 72, h: 124, win: '#fbbf24' },
      { x: 662, w: 96, h: 188, win: '#38bdf8' }, { x: 766, w: 76, h: 136, win: '#f472b6' },
      { x: 848, w: 95, h: 168, win: '#fbbf24' },
    ];
    let envTime = 0;
    let decals = []; // { kind:'crack'|'scorch', x, r, life, maxLife, seed }
    let rainSplashes = []; // { x, y, life, maxLife }
    let wallHitFlash = { left: 0, right: 0 };
    let envLight = { alpha: 0, color: '#facc15', x: W / 2, y: GROUND_Y - 60 };
    let letterboxAmount = 0;

    function addDecal(kind, x, r = 38) {
      if (!feel.vfx) return;
      decals.push({ kind, x, r, life: 9, maxLife: 9, seed: Math.random() * 100 });
      if (decals.length > 18) decals.shift();
    }
    function flashEnvLight(x, y, color, alpha = 0.45) {
      if (!feel.vfx) return;
      envLight.x = x; envLight.y = y; envLight.color = color;
      envLight.alpha = Math.max(envLight.alpha, alpha);
    }

    function getPalette(biomeIdx) {
      const l = isLightTheme;
      const base = {
        playerBody: l ? '#0f172a' : '#f8fafc',
        playerAccent: '#fb923c',
        playerBand: '#ef4444',
        enemyBrawler: l ? '#0f766e' : '#2dd4bf',
        enemyShield: l ? '#1d4ed8' : '#60a5fa',
        enemyHeavy: l ? '#991b1b' : '#f87171',
        enemyStriker: l ? '#7e22ce' : '#c084fc',
        enemyAcrobat: l ? '#047857' : '#34d399',
        enemyBuffer: l ? '#b45309' : '#f59e0b',
        enemyBoss: l ? '#7f1d1d' : '#dc2626',
        enemyBossNinja: l ? '#581c87' : '#a855f7',
        enemyBossMage: l ? '#0369a1' : '#0ea5e9',
        enemyBossFortress: l ? '#1e3a8a' : '#3b82f6',
        enemyTwinFire: l ? '#c2410c' : '#f97316',
        enemyTwinIce: l ? '#0e7490' : '#22d3ee',
        enemyDummy: l ? '#b45309' : '#fbbf24',
        shieldFill: 'rgba(96,165,250,0.34)',
        shieldStroke: l ? '#2563eb' : '#93c5fd',
        hudText: l ? '#0f172a' : '#f8fafc',
        hudSub: l ? '#475569' : '#94a3b8',
        hpBg: l ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.16)',
        shadow: l ? 'rgba(15,23,42,0.22)' : 'rgba(0,0,0,0.48)',
        dust: l ? 'rgba(100,116,139,0.52)' : 'rgba(203,213,225,0.42)',
        speedLine: l ? 'rgba(15,23,42,0.18)' : 'rgba(255,255,255,0.2)',
        wallGlow: '#fb923c',
      };
      if (biomeIdx === 0) { // Neon Rain Alley
        return Object.assign(base, l ? {
          skyTop: '#e2e8f0', skyBot: '#cbd5e1', floorTop: '#94a3b8', floorBot: '#64748b',
          floorLine: '#475569', pillar: 'rgba(51,65,85,0.12)', accentGlow: '#0284c7',
        } : {
          skyTop: '#070b18', skyBot: '#131d38', floorTop: '#1e293b', floorBot: '#090e1a',
          floorLine: '#38bdf8', pillar: 'rgba(56,189,248,0.07)', accentGlow: '#38bdf8',
        });
      }
      if (biomeIdx === 1) { // Molten Steel Cage (Boss)
        return Object.assign(base, l ? {
          skyTop: '#fee2e2', skyBot: '#fecaca', floorTop: '#d6d3d1', floorBot: '#a8a29e',
          floorLine: '#dc2626', pillar: 'rgba(185,28,28,0.1)', accentGlow: '#dc2626',
        } : {
          skyTop: '#18090c', skyBot: '#2d1115', floorTop: '#292524', floorBot: '#141110',
          floorLine: '#ef4444', pillar: 'rgba(239,68,68,0.08)', accentGlow: '#f97316',
        });
      }
      // Sunset Dojo
      return Object.assign(base, l ? {
        skyTop: '#ffedd5', skyBot: '#fed7aa', floorTop: '#d6c5b3', floorBot: '#b59d84',
        floorLine: '#9a3412', pillar: 'rgba(154,52,18,0.1)', accentGlow: '#ea580c',
      } : {
        skyTop: '#1e1024', skyBot: '#451a2b', floorTop: '#2c1e1a', floorBot: '#170f0d',
        floorLine: '#fb923c', pillar: 'rgba(251,146,60,0.08)', accentGlow: '#fb923c',
      });
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ==================== Web Audio Procedural SFX ====================
    let audioCtx = null, noiseBuffer = null;
    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        const len = audioCtx.sampleRate * 0.5;
        noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    const sfx = {
      whoosh(pitch = 1) {
        if (!feel.sfx || !audioCtx || !noiseBuffer) return;
        const t = audioCtx.currentTime;
        const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
        const f = audioCtx.createBiquadFilter(); f.type = 'bandpass';
        f.frequency.setValueAtTime(540 * pitch, t);
        f.frequency.exponentialRampToValueAtTime(160 * pitch, t + 0.09);
        f.Q.value = 1.5;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.13, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        src.connect(f).connect(g).connect(audioCtx.destination);
        src.start(t); src.stop(t + 0.11);
      },
      hit(power = 1) {
        if (!feel.sfx || !audioCtx || !noiseBuffer) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        osc.type = power >= 2 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(170 + power * 24, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.08 + power * 0.035);
        const og = audioCtx.createGain();
        og.gain.setValueAtTime(Math.min(0.42, 0.2 + power * 0.08), t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.11 + power * 0.04);
        osc.connect(og).connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.18 + power * 0.04);

        const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
        const flt = audioCtx.createBiquadFilter(); flt.type = 'bandpass';
        flt.frequency.setValueAtTime(1450 - power * 180, t); flt.Q.value = 0.8;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(Math.min(0.32, 0.13 + power * 0.06), t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.055 + power * 0.02);
        src.connect(flt).connect(ng).connect(audioCtx.destination);
        src.start(t); src.stop(t + 0.11);
      },
      block() {
        if (!feel.sfx || !audioCtx) return;
        const t = audioCtx.currentTime;
        [900, 1450].forEach((fr, idx) => {
          const o = audioCtx.createOscillator(); o.type = idx === 0 ? 'triangle' : 'sine';
          o.frequency.setValueAtTime(fr, t); o.frequency.exponentialRampToValueAtTime(fr * 0.84, t + 0.12);
          const g = audioCtx.createGain(); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.15);
        });
      },
      parry() {
        if (!feel.sfx || !audioCtx) return;
        const t = audioCtx.currentTime;
        [1180, 1770, 2650].forEach((fr, i) => {
          const o = audioCtx.createOscillator(); o.type = 'sine';
          o.frequency.setValueAtTime(fr, t + i * 0.012);
          o.frequency.exponentialRampToValueAtTime(fr * 1.06, t + 0.24);
          const g = audioCtx.createGain(); g.gain.setValueAtTime(0.16, t + i * 0.012);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          o.connect(g).connect(audioCtx.destination); o.start(t + i * 0.012); o.stop(t + 0.3);
        });
      },
      guardBreak() {
        if (!feel.sfx || !audioCtx || !noiseBuffer) return;
        this.hit(3);
        const t = audioCtx.currentTime;
        [1850, 2500, 3200].forEach((f, i) => {
          const o = audioCtx.createOscillator(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(f, t + i * 0.02); o.frequency.exponentialRampToValueAtTime(f * 0.42, t + 0.22);
          const g = audioCtx.createGain(); g.gain.setValueAtTime(0.08, t + i * 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
          o.connect(g).connect(audioCtx.destination); o.start(t + i * 0.02); o.stop(t + 0.26);
        });
      },
      explosion() {
        if (!feel.sfx || !audioCtx || !noiseBuffer) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(22, t + 0.36);
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.48, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.4);

        const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
        const flt = audioCtx.createBiquadFilter(); flt.type = 'lowpass';
        flt.frequency.setValueAtTime(950, t); flt.frequency.exponentialRampToValueAtTime(120, t + 0.35);
        const ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.36, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
        src.connect(flt).connect(ng).connect(audioCtx.destination); src.start(t); src.stop(t + 0.38);
      },
      superStart() {
        if (!feel.sfx || !audioCtx) return;
        const t = audioCtx.currentTime;
        [330, 495, 660, 990].forEach((f, i) => {
          const o = audioCtx.createOscillator(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(f, t + i * 0.025);
          o.frequency.exponentialRampToValueAtTime(f * 1.4, t + 0.28);
          const g = audioCtx.createGain(); g.gain.setValueAtTime(0.09, t + i * 0.025);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
          o.connect(g).connect(audioCtx.destination); o.start(t + i * 0.025); o.stop(t + 0.34);
        });
      },
      pickup() {
        if (!feel.sfx || !audioCtx) return;
        const t = audioCtx.currentTime;
        [660, 880, 1175].forEach((f, i) => {
          const o = audioCtx.createOscillator(); o.type = 'sine';
          o.frequency.setValueAtTime(f, t + i * 0.045);
          const g = audioCtx.createGain(); g.gain.setValueAtTime(0.12, t + i * 0.045);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.045 + 0.14);
          o.connect(g).connect(audioCtx.destination); o.start(t + i * 0.045); o.stop(t + i * 0.045 + 0.16);
        });
      },
      chargeReady() {
        if (!feel.sfx || !audioCtx) return;
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + 0.09);
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.17);
      },

        const t = audioCtx.currentTime;
        const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
        const flt = audioCtx.createBiquadFilter(); flt.type = 'highpass'; flt.frequency.value = 1800;

      upgradeChoices = shuffled.slice(0, 3);
      hoveredCard = -1;

        player.maxHp += 20;
        player.hp = Math.min(player.maxHp, player.hp + 22);

        player.maxSp += 30;
        player.sp = player.maxSp;

        player.hp = Math.min(player.maxHp, player.hp + 12);

      restoreStamina(player.maxSp, true);
      runStats.waveNoHit = true;
      runStats.waveBonus = null;

      refreshBuildSummary();
      upgradeChoices = [];

      const waveBonus = wave * 500;
      const killBonus = runStats.kills * 120;
      const comboBonus = runStats.maxCombo * 80;
      const techCount = runStats.parries + runStats.guardBreaks;
      const techBonus = techCount * 250;
      const totalScore = score + waveBonus + killBonus + comboBonus + techBonus;
      const isNewRecord = totalScore > bestScore;
      if (isNewRecord) { bestScore = totalScore; hudBest.textContent = `BEST ${bestScore}`; try { localStorage.setItem("iron_impact_best", String(bestScore)); } catch {} }
      const rank = totalScore >= 9500 ? 'SSS' : totalScore >= 7000 ? 'SS' : totalScore >= 4800 ? 'S' : totalScore >= 3200 ? 'A' : totalScore >= 1800 ? 'B' : totalScore >= 900 ? 'C' : 'D';
      settlement = {
        combatScore: score, wave, kills: runStats.kills, maxCombo: runStats.maxCombo, techCount,
        waveBonus, killBonus, comboBonus, techBonus, totalScore, isNewRecord, rank,
      };
      hudScore.textContent = `SCORE ${totalScore}`;
      sfx.explosion();
    }

    function resetGame(bossWaveNum = 0) {
      player = createPlayer();
      particles = []; arcs = []; rings = []; floatTexts = []; afterimages = []; lightnings = [];
      projectiles = []; props = []; pickups = []; shockwaves = []; hazards = [];
      decals = []; rainSplashes = []; wallHitFlash.left = 0; wallHitFlash.right = 0; envLight.alpha = 0; letterboxAmount = 0;
      activeUpgrades = {}; upgradeChoices = []; refreshBuildSummary();
      score = 0; wave = bossWaveNum ? bossWaveNum : 1; comboCount = 0; comboTimer = 0; thunderCounter = 0;
      gameOver = false; settlement = null;
      runStats = { kills: 0, maxCombo: 0, parries: 0, guardBreaks: 0, waveNoHit: true, waveBonus: null };
      hitStopTimer = 0; slowMoTimer = 0; slowMoScale = 1;
      camShakeMag = 0; camZoom = 1; camZoomTarget = 1; speedLineAlpha = 0; superCinematicAlpha = 0;
      waveClearPending = false; waveClearDelay = 0;
      hudScore.textContent = 'SCORE 0';
      if (bossWaveNum) {
        mode = 'waves';
        btnMode.textContent = '木桩训练';
        player.ex = 15; // Modest starting EX, must earn Super!
        spawnWave(bossWaveNum);
      } else if (mode === 'dummy') {
        spawnDummyMode();
      } else {
        spawnWave(1);
      }
    }

    function showBanner(text, sub = '') { bannerText = text; bannerSub = sub; bannerTimer = 1.9; }

    // ==================== VFX Helpers ====================
    function triggerShake(mag, dx = 0, dy = 0) {
      if (!feel.shake) return;
      camShakeMag = Math.max(camShakeMag, mag);
      camShakeX += dx * mag * 0.45; camShakeY += dy * mag * 0.35;
    }
    function triggerHitStop(sec) { if (feel.hitstop) hitStopTimer = Math.max(hitStopTimer, sec); }
    function triggerZoom(z, lines = 0) {
      if (!feel.shake) return;
      camZoomTarget = Math.max(camZoomTarget, z);
      if (lines > 0) speedLineAlpha = Math.max(speedLineAlpha, lines);
    }
    function applySquash(ent, sx, sy) { if (feel.squash) { ent.scaleX = sx; ent.scaleY = sy; } }
    function addRing(x, y, maxR, color, lw = 4) { if (feel.vfx) rings.push({ x, y, r: 8, maxR, color, lineWidth: lw, life: 0.23, maxLife: 0.23 }); }
    function addSparks(x, y, count, dx, dy, color, speed = 340, size = 3.5) {
      if (!feel.vfx) return;
      const ba = Math.atan2(dy, dx);
      for (let i = 0; i < count; i++) {
        const ang = ba + (Math.random() - 0.5) * 1.4;
        const spd = speed * (0.45 + Math.random() * 0.85);
        particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 40, life: 0.16 + Math.random() * 0.2, maxLife: 0.36, color, size: size * (0.7 + Math.random() * 0.8), gravity: 540, kind: 'spark' });
      }
    }
    function addShards(x, y, count, dx, color) {
      if (!feel.vfx) return;
      for (let i = 0; i < count; i++) {
        particles.push({ x: x + (Math.random() - 0.5) * 18, y: y + (Math.random() - 0.5) * 32, vx: dx * (150 + Math.random() * 340) + (Math.random() - 0.5) * 140, vy: -140 - Math.random() * 250, rot: Math.random() * 6.28, vrot: (Math.random() - 0.5) * 18, life: 0.42 + Math.random() * 0.35, maxLife: 0.77, color, size: 5 + Math.random() * 6, gravity: 980, kind: 'shard' });
      }
    }
    function addDust(x, y, count, dx = 0) {
      if (!feel.vfx) return;
      const pal = getPalette(getBiome(wave));
      for (let i = 0; i < count; i++) {
        particles.push({ x: x + (Math.random() - 0.5) * 18, y: y - Math.random() * 6, vx: dx * (40 + Math.random() * 90) + (Math.random() - 0.5) * 65, vy: -15 - Math.random() * 55, life: 0.24 + Math.random() * 0.22, maxLife: 0.46, color: pal.dust, size: 4 + Math.random() * 6, gravity: -20, kind: 'dust' });
      }
    }
    function addFloatText(x, y, text, color, scale = 1) { floatTexts.push({ x, y, vy: -88, text, color, scale, life: 0.72, maxLife: 0.72 }); }
    function addArc(x, y, dir, arcType, color) { if (feel.vfx) arcs.push({ x, y, dir, arcType, color, life: 0.14, maxLife: 0.14 }); }
    function addAfterimage(ent, color) {
      if (!feel.vfx) return;
      afterimages.push({ x: ent.x, y: ent.y, vx: ent.vx, dir: ent.dir, scaleX: ent.scaleX, scaleY: ent.scaleY, state: ent.state, attackKey: ent.attackKey, animTime: ent.animTime, color, life: 0.16, maxLife: 0.16 });
    }
    function addLightning(x, yTop, yBot) {
      if (!feel.vfx) return;
      const pts = [];
      const steps = 6;
      for (let i = 0; i <= steps; i++) {
        pts.push({ x: x + (i === 0 || i === steps ? 0 : (Math.random() - 0.5) * 28), y: yTop + (yBot - yTop) * (i / steps) });
      }
      lightnings.push({ pts, life: 0.22, maxLife: 0.22 });
    }

    function gainEx(amount) {
      const mult = 1 + hasUpgrade('fury') * 0.3 + (comboCount >= 10 ? 0.15 : 0);
      player.ex = Math.min(player.maxEx, player.ex + amount * mult);
    }

    // ==================== Barrel Explosion ====================
    function explodeBarrel(prop) {
      const idx = props.indexOf(prop);
      if (idx !== -1) props.splice(idx, 1);
      sfx.explosion();
      triggerHitStop(0.11);
      triggerShake(22, 0, -0.5);
      triggerZoom(1.08, 0.85);
      addRing(prop.x, prop.y - 24, 155, '#f97316', 7);
      addRing(prop.x, prop.y - 24, 105, '#facc15', 5);
      addDecal('scorch', prop.x, 56);
      flashEnvLight(prop.x, prop.y - 36, '#f97316', 0.65);
      addSparks(prop.x, prop.y - 24, 28, 0, -1, '#facc15', 460, 5);
      addShards(prop.x, prop.y - 24, 14, 0, '#ef4444');
      addFloatText(prop.x, prop.y - 78, 'BOOM!!', '#facc15', 1.45);

      for (const e of enemies) {
        if (e.state === 'dead') continue;
        const dist = Math.hypot(e.x - prop.x, (e.y - 30) - (prop.y - 24));
        if (dist < 165) {
          const fakeAtk = { dmg: 64, posture: 45, hitstop: 0.04, kbX: 600, kbY: -340, shake: 12, color: '#f97316', power: 2.5, guardBreak: true, wallBounce: true, exGain: 10 };
          const dir = e.x >= prop.x ? 1 : -1;
          handleAttackHit(e, fakeAtk, true, dir);
        }
      }
      if (mode === 'dummy') {
        setTimeout(() => { if (mode === 'dummy') spawnProp('barrel', 550); }, 3200);
      }
    }

    // ==================== Combat Actions ====================
    function startAttack(keyName) {
      const atk = ATTACKS[keyName];
      const isLight = keyName === 'jab1' || keyName === 'jab2' || keyName === 'airKick';
      if (!consumeStamina(atk.spCost || 0, isLight)) return;
      player.state = 'attack';
      player.attackKey = keyName;
      player.attackTime = 0;
      player.attackHitIds.clear();
      player.vx = player.dir * atk.lunge;
      if (keyName === 'uppercut') { player.vy = -315; player.onGround = false; }
      else if (keyName === 'airKick') { player.vy = Math.min(player.vy, -140); }
      else if (keyName === 'airSlam') { player.vx = player.dir * 265; player.vy = 780; }
      applySquash(player, 1.28, 0.78);
      sfx.whoosh(keyName === 'chargePunch' ? 0.65 : keyName === 'kick3' ? 0.85 : 1.15);
      addArc(player.x + player.dir * 28, player.y - 34, player.dir, atk.arcType, atk.color);
      if (player.onGround) addDust(player.x - player.dir * 12, GROUND_Y, 4, -player.dir);
    }

    function triggerLightAttack() {
      if (player.state === 'hurt' || player.state === 'super') return;
      if (player.state === 'dash') {
        startAttack('dashKnee');
        return;
      }
      if (!player.onGround) {
        if (player.airComboCount < 2) { player.airComboCount++; startAttack('airKick'); }
        return;
      }
      if (player.comboResetTimer > 0 && player.comboStep === 1) { player.comboStep = 2; startAttack('jab2'); }
      else if (player.comboResetTimer > 0 && player.comboStep === 2) { player.comboStep = 0; startAttack('kick3'); }
      else { player.comboStep = 1; startAttack('jab1'); }
      player.comboResetTimer = 0.42;
    }

    function triggerParry() {
      if (player.parryCooldown > 0 || player.state === 'hurt' || player.state === 'super') return;
      if (!consumeStamina(12, false)) return;
      kHolding = false; kHoldTime = 0;
      player.state = 'parry';
      player.parryTimer = 0.24 + hasUpgrade('parryking') * 0.08;
      player.parryCooldown = 0.42;
      player.vx *= 0.2;
      applySquash(player, 0.9, 1.12);
      addRing(player.x + player.dir * 12, player.y - 34, 42, '#facc15', 3);
      sfx.whoosh(1.6);
    }

    function triggerSuper() {
      if (player.ex < player.maxEx || player.state === 'super' || player.state === 'hurt') return;
      kHolding = false; kHoldTime = 0;
      player.ex = 0;
      restoreStamina(player.maxSp, true);
      player.state = 'super';
      player.superStep = 0;
      player.superTimer = 0;
      player.invulnTimer = 1.4;
      player.vx = 0; player.vy = 0;
      superCinematicAlpha = 0.85;
      slowMoTimer = 0.24; slowMoScale = 0.22;
      triggerZoom(1.11, 1.0);
      sfx.superStart();
      addFloatText(player.x, player.y - 90, '奥义 · 崩山乱舞!!', '#facc15', 1.45);
      addRing(player.x, player.y - 36, 110, '#facc15', 5);
      flashEnvLight(player.x, player.y - 45, '#facc15', 0.55);
    }

    function triggerDash() {
      if (player.dashCooldown > 0 || player.state === 'hurt' || player.state === 'super') return;
      const dashSp = hasUpgrade('phantom') ? 11 : 22;
      if (!consumeStamina(dashSp, false)) return;
      let perfect = false;
      for (const e of enemies) {
        if ((e.state === 'windup' || e.state === 'strike') && Math.abs(e.x - player.x) < 120) { perfect = true; break; }
      }
      const dashX = player.x, dashY = player.y;
      player.state = 'dash';
      kHolding = false; kHoldTime = 0; kChargeNotified = false;
      player.dashTimer = 0.16;
      player.dashCooldown = hasUpgrade('phantom') ? 0.14 : 0.28;
      player.invulnTimer = 0.24;
      const moveDir = (keys['KeyA'] || keys['ArrowLeft']) ? -1 : (keys['KeyD'] || keys['ArrowRight']) ? 1 : player.dir;
      player.dir = moveDir;
      player.vx = moveDir * 640;
      player.vy = Math.min(0, player.vy);
      applySquash(player, 1.38, 0.72);
      addDust(player.x, player.y, 7, -moveDir);
      sfx.whoosh(1.45);

      // Phantom Bomb Upgrade
      if (hasUpgrade('phantom')) {
        addRing(dashX, dashY - 32, 72, '#a855f7', 4);
        for (const e of enemies) {
          if (e.state !== 'dead' && Math.abs(e.x - dashX) < 84) {
            handleAttackHit(e, { dmg: 16 * hasUpgrade('phantom'), posture: 10, hitstop: 0.02, kbX: 180, kbY: -120, shake: 5, color: '#a855f7', power: 1.1, exGain: 5 }, true);
          }
        }
      }

      if (perfect) {
        slowMoTimer = 0.34; slowMoScale = 0.32;
        gainEx(9);
        restoreStamina(28, true);
        sfx.parry();
        addFloatText(player.x, player.y - 80, '极限闪避! +EX +SP', '#38bdf8', 1.12);
        addRing(player.x, player.y - 34, 74, '#38bdf8', 3);
      }
    }

    function canActNow() {
      if (player.state === 'idle' || player.state === 'run' || player.state === 'dash') return true;
      if (player.state === 'attack') {
        const atk = ATTACKS[player.attackKey];
        return player.attackTime >= atk.startup + atk.active + 0.02 && player.attackKey !== 'airSlam';
      }
      return false;
    }

    function handleAttackHit(enemy, atk, isAoE = false, forcedDir = null) {
      const hitDir = forcedDir !== null ? forcedDir : (enemy.x >= player.x ? 1 : -1);
      const hitX = isAoE ? enemy.x : (player.x + enemy.x) * 0.5 + hitDir * 8;
      const hitY = enemy.y - enemy.h * 0.54;

      // Shield Front Block
      const attackingFront = hitDir !== enemy.dir;
      if (enemy.hasShield && attackingFront && !atk.guardBreak && !isAoE) {
        enemy.vx = hitDir * 95;
        enemy.flashTimer = 0.06;
        applySquash(enemy, 0.85, 1.12);
        triggerHitStop(0.045);
        triggerShake(4, hitDir, 0);
        addSparks(hitX, hitY, 10, -hitDir, -0.3, '#93c5fd', 290, 3);
        addRing(hitX, hitY, 34, '#93c5fd', 3);
        addFloatText(enemy.x, enemy.y - 74, '格挡! 长按K破防', '#60a5fa', 0.9);
        sfx.block();
        return;
      }

      // Compute damage with upgrades
      let dmg = atk.dmg;
      if (hasUpgrade('flame') && (atk === ATTACKS.chargePunch || atk === ATTACKS.uppercut || atk === ATTACKS.airSlam || atk === ATTACKS.kick3)) {
        dmg = Math.round(dmg * (1 + 0.35 * hasUpgrade('flame')));
        addRing(hitX, hitY, 58, '#f97316', 4);
        addDecal('scorch', enemy.x, 28);
        flashEnvLight(hitX, hitY, '#f97316', 0.32);
      }
      if (hasUpgrade('fury') && (atk === ATTACKS.superFlurry || atk === ATTACKS.superFinisher)) {
        dmg = Math.round(dmg * (1 + 0.3 * hasUpgrade('fury')));
      }
      if (enemy.state === 'stunned') dmg = Math.round(dmg * 1.45);

      let hitstop = atk.hitstop;
      let shake = atk.shake;

      // Guard Break! (Supports multi-layer shield on Fortress Boss)
      if (enemy.hasShield && atk.guardBreak) {
        enemy.shieldHp = Math.max(0, (enemy.shieldHp || 1) - (atk === ATTACKS.superFinisher ? 2 : 1));
        if (enemy.shieldHp > 0) {
          hitstop = 0.11; shake = 14;
          addShards(hitX, hitY, 10, hitDir, '#60a5fa');
          addRing(hitX, hitY, 72, '#38bdf8', 5);
          addFloatText(enemy.x, enemy.y - 102, '能量盾龟裂! 再蓄力一击!', '#38bdf8', 1.2);
          sfx.guardBreak();
          gainEx(8);
        } else {
          enemy.hasShield = false;
          enemy.state = 'stunned';
          enemy.stateTimer = enemy.type === 'boss_fortress' ? 4.2 : 2.6;
          if (enemy.type === 'boss_fortress') enemy.shieldRegenTimer = 6.2;
          dmg = Math.round(dmg * (enemy.type === 'boss_fortress' ? 1.5 : 1.25));
          hitstop = 0.16; shake = 20;
          slowMoTimer = 0.24; slowMoScale = 0.25;
          triggerZoom(1.09, 0.95);
          addShards(hitX, hitY, 18, hitDir, '#60a5fa');
          addRing(hitX, hitY, 108, '#facc15', 6);
          addFloatText(enemy.x, enemy.y - 102, enemy.type === 'boss_fortress' ? '核心过热暴露!! 1.7x伤害' : 'GUARD BREAK!!', '#facc15', 1.38);
          sfx.guardBreak();
          gainEx(10);
          restoreStamina(25, true);
          runStats.guardBreaks++;
          if (enemy.type === 'dummy') setTimeout(() => { if (enemies.includes(enemy)) { enemy.hasShield = true; enemy.shieldHp = 1; } }, 3200);
        }
      } else {
        sfx.hit(atk.power);
        if (atk.zoom) triggerZoom(atk.zoom, atk.power >= 2 ? 0.65 : 0);
      }

      // Boss Posture / Armor Bar
      let armorResisted = false;
      if (enemy.isBoss && enemy.state !== 'stunned') {
        enemy.posture = Math.max(0, enemy.posture - (atk.posture || 12));
        if (enemy.posture <= 0) {
          enemy.state = 'stunned';
          enemy.stateTimer = 3.2;
          enemy.posture = enemy.maxPosture;
          hitstop = 0.16; shake = 22;
          slowMoTimer = 0.28; slowMoScale = 0.25;
          triggerZoom(1.1, 1.0);
          addRing(hitX, hitY, 120, '#facc15', 6);
          addFloatText(enemy.x, enemy.y - 115, '霸体破防 · 处决时机!!', '#facc15', 1.35);
          sfx.guardBreak();
          runStats.guardBreaks++;
          restoreStamina(40, true);
        } else if (enemy.state === 'windup' || enemy.state === 'strike') {
          armorResisted = true; // Boss super-armor during attacks
        }
      }

      if (enemy.type !== 'dummy') enemy.hp = Math.max(0, enemy.hp - dmg);
      enemy.flashTimer = 0.085;
      enemy.hitJitterTimer = hitstop + 0.04;

      if (!armorResisted) {
        const heavyFactor = enemy.isBoss ? 0.42 : enemy.isHeavy ? 0.68 : 1;
        enemy.vx = hitDir * atk.kbX * (atk.guardBreak ? Math.max(0.75, heavyFactor) : heavyFactor);
        enemy.vy = atk.kbY * (enemy.isBoss ? 0.35 : enemy.isHeavy && !atk.launcher ? 0.72 : 1);
        enemy.wallBounceArmed = !!atk.wallBounce;
        if (enemy.state !== 'stunned') {
          enemy.state = 'hurt';
          enemy.stateTimer = Math.max(0.32, hitstop + 0.25);
        }
      }

      applySquash(enemy, atk.launcher ? 0.74 : 0.64, 1.36);
      triggerHitStop(hitstop);
      triggerShake(shake, hitDir, atk.launcher ? -0.7 : 0.2);
      addSparks(hitX, hitY, Math.round(8 + atk.power * 5.5), hitDir, atk.launcher ? -0.8 : -0.15, atk.color, 300 + atk.power * 85, 3 + atk.power * 0.65);
      addRing(hitX, hitY, 32 + atk.power * 20, atk.color, 2.5 + atk.power);
      addFloatText(enemy.x + (Math.random() - 0.5) * 20, enemy.y - enemy.h - 10, `${dmg}`, atk.power >= 2 || enemy.state === 'stunned' ? '#facc15' : '#ffffff', atk.power >= 2 ? 1.25 : 0.95);

      if (atk.exGain) gainEx(atk.exGain);
      if (atk.spRefund) restoreStamina(atk.spRefund, false);

      // Combo & Thunder Upgrade
      comboCount++; comboTimer = 2.6; comboScale = 1.55;
      if (comboCount > runStats.maxCombo) runStats.maxCombo = comboCount;
      if (hasUpgrade('thunder')) {
        thunderCounter++;
        if (thunderCounter >= 4) {
          thunderCounter = 0;
          const ldmg = 22 * hasUpgrade('thunder');
          if (enemy.type !== 'dummy') enemy.hp = Math.max(0, enemy.hp - ldmg);
          addLightning(enemy.x, 10, enemy.y - enemy.h * 0.5);
          flashEnvLight(enemy.x, enemy.y - 60, '#38bdf8', 0.48);
          addSparks(enemy.x, enemy.y - 36, 12, 0, -1, '#38bdf8', 320, 3.5);
          addFloatText(enemy.x, enemy.y - enemy.h - 32, `⚡${ldmg}`, '#38bdf8', 1.15);
          sfx.lightning();
        }
      }

      score += dmg * Math.max(1, Math.min(5, Math.floor(comboCount / 3) + 1));
      if (score > bestScore) { bestScore = score; hudBest.textContent = `BEST ${bestScore}`; try { localStorage.setItem("iron_impact_best", String(bestScore)); } catch {} }
      hudScore.textContent = `SCORE ${score}`;

      // KO Check
      if (enemy.type !== 'dummy' && enemy.hp <= 0) {
        enemy.state = 'dead';
        runStats.kills++;
        enemy.vx = hitDir * Math.max(380, Math.abs(enemy.vx));
        enemy.vy = Math.min(-280, enemy.vy);
        slowMoTimer = Math.max(slowMoTimer, enemy.isBoss ? 0.55 : 0.22);
        slowMoScale = Math.min(slowMoScale, enemy.isBoss ? 0.2 : 0.35);
        addFloatText(enemy.x, enemy.y - enemy.h - 18, enemy.isBoss ? 'BOSS 击破!!' : 'K.O.!', '#ef4444', enemy.isBoss ? 1.6 : 1.35);
        if (hasUpgrade('vamp')) {
          const heal = 8 * hasUpgrade('vamp');
          player.hp = Math.min(player.maxHp, player.hp + heal);
          restoreStamina(20 * hasUpgrade('vamp'), false);
          addFloatText(player.x, player.y - 78, `+${heal} HP +SP`, '#22c55e', 0.95);
        }
        // Twin Boss Synergy Awakening when one twin falls!
        if (enemy.type === 'boss_twin_fire' || enemy.type === 'boss_twin_ice') {
          const sibling = enemies.find(a => a !== enemy && a.state !== 'dead' && (a.type === 'boss_twin_fire' || a.type === 'boss_twin_ice'));
          if (sibling) {
            sibling.phase = 2;
            sibling.hp = Math.min(sibling.maxHp, sibling.hp + Math.round(sibling.maxHp * 0.22));
            sibling.dmg = Math.round(sibling.dmg * 1.32);
            sibling.speed = Math.round(sibling.speed * 1.22);
            sibling.posture = sibling.maxPosture;
            triggerShake(18, 0, 0);
            flashEnvLight(sibling.x, sibling.y - 50, '#facc15', 0.65);
            addRing(sibling.x, sibling.y - 40, 150, '#facc15', 6);
            addFloatText(sibling.x, sibling.y - 98, '双生共鸣 · 孤煞觉醒!!', '#facc15', 1.4);
            sfx.explosion();
          }
        }
        // Killing a Buffer Shaman breaks buffs on all allies!
        if (enemy.type === 'buffer') {
          let disrupted = false;
          for (const ally of enemies) {
            if (ally !== enemy && ally.state !== 'dead' && ally.buffTimer > 0) {
              ally.buffTimer = 0;
              ally.state = 'hurt'; ally.stateTimer = 0.5;
              ally.flashTimer = 0.1;
              disrupted = true;
            }
          }
          if (disrupted) addFloatText(enemy.x, enemy.y - 96, '战鼓溃散! 敌群削弱!', '#facc15', 1.25);
        }
        if (Math.random() < 0.24 || enemy.isBoss) {
          spawnPickup(player.hp < player.maxHp * 0.65 ? 'heal' : 'ex', enemy.x, enemy.y - 28);
        }
      }
    }

    function damagePlayer(dmg, fromDir, attacker = null) {
      // Check Active Parry!
      if (player.state === 'parry') {
        player.state = 'idle';
        player.parryTimer = 0;
        player.parryCooldown = 0.08;
        player.invulnTimer = 0.42;
        gainEx(16);
        restoreStamina(hasUpgrade('parryking') ? player.maxSp : 45, true);
        runStats.parries++;
        const healAmt = 5 + hasUpgrade('parryking') * 10;
        player.hp = Math.min(player.maxHp, player.hp + healAmt);
        triggerHitStop(0.14);
        triggerShake(15, -fromDir, 0);
        triggerZoom(1.08, 0.9);
        slowMoTimer = 0.25; slowMoScale = 0.28;
        addRing(player.x + player.dir * 14, player.y - 34, 105, '#facc15', 6);
        flashEnvLight(player.x + player.dir * 14, player.y - 34, '#facc15', 0.5);
        addSparks(player.x + player.dir * 14, player.y - 34, 22, -fromDir, -0.3, '#facc15', 420, 4.5);
        addFloatText(player.x, player.y - 88, 'PERFECT PARRY!! +SP', '#facc15', 1.32);
        sfx.parry();
        if (attacker && attacker.state !== 'dead') {
          attacker.state = 'stunned';
          attacker.stateTimer = attacker.isBoss ? 1.85 : 2.3;
          attacker.vx = -fromDir * 240;
          attacker.flashTimer = 0.14;
          if (attacker.isBoss) attacker.posture = Math.max(0, attacker.posture - 48);
          if (hasUpgrade('parryking')) {
            handleAttackHit(attacker, { dmg: 35 * hasUpgrade('parryking'), posture: 26, hitstop: 0.02, kbX: 320, kbY: -180, shake: 8, color: '#22c55e', power: 1.8, exGain: 0 }, true, -fromDir);
          }
        }
        return 'parried';
      }

      if (player.invulnTimer > 0) return 'evaded';
      runStats.waveNoHit = false;
      player.hp = Math.max(0, player.hp - dmg);
      player.state = 'hurt';
      player.hurtTimer = 0.28;
      player.invulnTimer = 0.44;
      player.flashTimer = 0.1;
      player.vx = fromDir * 260;
      player.vy = -175;
      kHolding = false; kHoldTime = 0;
      comboCount = 0;
      applySquash(player, 0.7, 1.32);
      triggerHitStop(0.06);
      triggerShake(11, fromDir, 0);
      addSparks(player.x, player.y - 34, 10, fromDir, -0.2, '#ef4444', 280, 3);
      addFloatText(player.x, player.y - 74, `-${dmg}`, '#ef4444', 1.15);
      sfx.hit(1.5);
      if (player.hp <= 0) {
        if (mode === 'dummy') {
          showBanner('训练复活！', '满血满体继续练习');
          player.hp = player.maxHp;
          restoreStamina(player.maxSp, true);
          player.invulnTimer = 1.2;
        } else {
          triggerGameOver();
        }
      }
      return 'hit';
    }

    // ==================== Update Loop ====================
    function update(rawDt) {
      const dtC = Math.min(rawDt, 0.04);

      // Ambient weather always moves
      envTime += dtC;
      wallHitFlash.left = Math.max(0, wallHitFlash.left - dtC * 2.8);
      wallHitFlash.right = Math.max(0, wallHitFlash.right - dtC * 2.8);
      envLight.alpha = Math.max(0, envLight.alpha - dtC * 2.4);
      const targetLb = player.state === 'super' ? 1 : 0;
      letterboxAmount += (targetLb - letterboxAmount) * Math.min(1, dtC * 12);

      const biome = getBiome(wave);
      for (const a of ambientParticles) {
        if (biome === 0) { // Rain
          a.x -= 130 * a.spd * dtC; a.y += 440 * a.spd * dtC;
          if (a.y > GROUND_Y) {
            if (Math.random() < 0.35 && rainSplashes.length < 24) {
              rainSplashes.push({ x: a.x, y: GROUND_Y + 4 + Math.random() * 44, life: 0.28, maxLife: 0.28 });
            }
            a.y = -10; a.x = Math.random() * (W + 140);
          }
        } else if (biome === 1) { // Rising embers
          a.x += Math.sin(a.phase + envTime * 2.6) * 28 * dtC;
          a.y -= 58 * a.spd * dtC;
          if (a.y < 0) { a.y = GROUND_Y + 10; a.x = Math.random() * W; }
        } else { // Falling petals
          a.x -= (42 + Math.sin(a.phase) * 18) * a.spd * dtC; a.y += 34 * a.spd * dtC;
          a.phase += dtC * 3.4;
          if (a.y > GROUND_Y + 14 || a.x < -12) { a.y = -8; a.x = Math.random() * (W + 100); }
        }
      }
      for (let i = rainSplashes.length - 1; i >= 0; i--) {
        rainSplashes[i].life -= dtC;
        if (rainSplashes[i].life <= 0) rainSplashes.splice(i, 1);
      }
      for (let i = decals.length - 1; i >= 0; i--) {
        decals[i].life -= dtC;
        if (decals[i].life <= 0) decals.splice(i, 1);
      }

      if (upgradeChoices.length > 0 || gameOver) return; // Pause during upgrade selection or settlement

      // Camera shake & zoom
      if (camShakeMag > 0.1) {
        camShakeX = (Math.random() - 0.5) * 2 * camShakeMag;
        camShakeY = (Math.random() - 0.5) * 2 * camShakeMag;
        camShakeMag *= Math.pow(0.0008, dtC);
      } else { camShakeX = 0; camShakeY = 0; camShakeMag = 0; }
      camZoom += (camZoomTarget - camZoom) * Math.min(1, dtC * 18);
      camZoomTarget += (1 - camZoomTarget) * Math.min(1, dtC * 8);
      speedLineAlpha = Math.max(0, speedLineAlpha - dtC * 3.5);
      superCinematicAlpha = Math.max(0, superCinematicAlpha - dtC * 1.4);
      if (bannerTimer > 0) bannerTimer -= dtC;

      if (hitStopTimer > 0) {
        hitStopTimer -= dtC;
        for (const e of enemies) if (e.hitJitterTimer > 0) e.hitJitterTimer -= dtC;
        return;
      }

      let timeScale = 1;
      if (slowMoTimer > 0) { slowMoTimer -= dtC; timeScale = slowMoScale; }
      const dt = dtC * timeScale;

      if (comboTimer > 0) { comboTimer -= dtC; if (comboTimer <= 0) { comboCount = 0; thunderCounter = 0; } }
      comboScale += (1 - comboScale) * Math.min(1, dtC * 14);

      if (inputBuffer) {
        if (performance.now() - inputBuffer.time > 140) inputBuffer = null;
        else if (canActNow()) {
          const act = inputBuffer.type; inputBuffer = null;
          if (act === 'J') triggerLightAttack();
          else if (act === 'K_TAP') startAttack(player.onGround ? 'uppercut' : 'airSlam');
          else if (act === 'L') triggerDash();
          else if (act === 'I') triggerParry();
        }
      }

      // Charge K
      if (kHolding) {
        kHoldTime += dtC;
        if (kHoldTime >= 0.16 && player.onGround && (player.state === 'idle' || player.state === 'run' || player.state === 'charge')) {
          player.state = 'charge';
          player.vx *= 0.82;
          if (feel.squash) { const p = Math.min(1, kHoldTime / 0.35); player.scaleX = 1 + p * 0.22; player.scaleY = 1 - p * 0.22; }
          if (feel.vfx && Math.random() < 0.65) {
            const ang = Math.random() * 6.28, dist = 36 + Math.random() * 24;
            particles.push({ x: player.x + player.dir * 10 + Math.cos(ang) * dist, y: player.y - 34 + Math.sin(ang) * dist, vx: -Math.cos(ang) * 145, vy: -Math.sin(ang) * 145, life: 0.2, maxLife: 0.2, color: kHoldTime >= 0.33 ? '#facc15' : '#fb923c', size: 3, gravity: 0, kind: 'spark' });
          }
          if (kHoldTime >= 0.33 && !kChargeNotified) {
            kChargeNotified = true;
            sfx.chargeReady();
            addRing(player.x + player.dir * 12, player.y - 34, 48, '#facc15', 3);
          }
        }
      }

      updatePlayer(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updateShockwaves(dt);
      updateHazards(dt);
      updateProps(dt);
      updatePickups(dt);
      updateVFX(dt);

      // Wave Progression & Roguelike Upgrade Picker
      if (mode === 'waves') {
        const alive = enemies.filter(e => e.state !== 'dead');
        if (alive.length === 0) {
          if (!waveClearPending) {
            waveClearPending = true;
            waveClearDelay = 0;
            showBanner(`WAVE ${wave} 清场！`, '选择你的战后强化词条...');
          } else {
            waveClearDelay += dtC;
            if (waveClearDelay >= 1.15) {
              waveClearPending = false;
              openUpgradePicker();
            }
          }
        }
      }
    }

    function hitCheckProps(boxX, reach, dir, isHeavy) {
      for (let i = props.length - 1; i >= 0; i--) {
        const p = props[i];
        if (p.x + 18 >= boxX && p.x - 18 <= boxX + reach && Math.abs(p.y - player.y) < 70) {
          p.flashTimer = 0.08;
          applySquash(p, 0.72, 1.3);
          if (p.kind === 'crate') {
            props.splice(i, 1);
            sfx.hit(1.5);
            triggerHitStop(0.045);
            addShards(p.x, p.y - 22, 12, dir, '#d97706');
            spawnPickup(player.hp < player.maxHp * 0.75 ? 'heal' : 'ex', p.x, p.y - 24);
            addFloatText(p.x, p.y - 54, '补给掉落!', '#facc15', 0.95);
          } else if (p.kind === 'barrel') {
            p.hp--;
            if (p.hp <= 0 || isHeavy) {
              if (!p.flying && !isHeavy) {
                p.flying = true; p.vx = dir * 560; p.vy = -120;
                sfx.hit(1.8); triggerHitStop(0.05); triggerShake(7, dir, 0);
                addFloatText(p.x, p.y - 56, '轰飞油桶!', '#f97316', 1.0);
              } else {
                explodeBarrel(p);
              }
            } else {
              p.flying = true; p.vx = dir * 540; p.vy = -110;
              sfx.hit(1.6); triggerHitStop(0.05); triggerShake(6, dir, 0);
              addFloatText(p.x, p.y - 56, '击飞油桶!', '#fb923c', 1.0);
            }
          }
        }
      }
    }

    function updatePlayer(dt) {
      player.animTime += dt;
      if (player.comboResetTimer > 0) player.comboResetTimer -= dt;
      if (player.dashCooldown > 0) player.dashCooldown -= dt;
      if (player.parryCooldown > 0) player.parryCooldown -= dt;
      if (player.invulnTimer > 0) player.invulnTimer -= dt;
      if (player.flashTimer > 0) player.flashTimer -= dt;
      if (player.slowTimer > 0) player.slowTimer -= dt;
      if (player.spRegenDelay > 0) player.spRegenDelay -= dt;
      if (player.exhaustedTimer > 0) player.exhaustedTimer -= dt;

      // Stamina drain while holding charge / auto-regen when resting
      if (player.state === 'charge') {
        player.sp = Math.max(0, player.sp - 12 * dt);
        player.spRegenDelay = 0.4;
      } else if (player.spRegenDelay <= 0 && player.state !== 'attack' && player.state !== 'dash') {
        const baseRate = player.exhaustedTimer > 0 ? 22 : 48;
        const rate = baseRate * (1 + hasUpgrade('breath') * 0.45);
        player.sp = Math.min(player.maxSp, player.sp + rate * dt);
      }

      if (player.state !== 'charge') {
        player.scaleX += (1 - player.scaleX) * Math.min(1, dt * 16);
        player.scaleY += (1 - player.scaleY) * Math.min(1, dt * 16);
      }

      const moveL = keys['KeyA'] || keys['ArrowLeft'];
      const moveR = keys['KeyD'] || keys['ArrowRight'];
      const moveAxis = (moveR ? 1 : 0) - (moveL ? 1 : 0);

      if (player.state === 'super') {
        player.superTimer += dt;
        superCinematicAlpha = Math.max(superCinematicAlpha, 0.55);
        if (Math.random() < 0.8) addAfterimage(player, '#facc15');
        const interval = 0.085;
        if (player.superStep < 7 && player.superTimer >= 0.18 + player.superStep * interval) {
          player.superStep++;
          player.x = Math.max(WALL_L + 20, Math.min(WALL_R - 20, player.x + player.dir * 26));
          addArc(player.x + player.dir * 34, player.y - 34 + (Math.random() - 0.5) * 28, player.dir, player.superStep % 2 === 0 ? 'hook' : 'thrust', '#facc15');
          sfx.whoosh(1.4);
          applySquash(player, 1.32, 0.78);
          for (const e of enemies) {
            if (e.state === 'dead') continue;
            const d = (e.x - player.x) * player.dir;
            if (d > -35 && d < 160) {
              // Pull gently into flurry
              e.x += (player.x + player.dir * 68 - e.x) * 0.25;
              handleAttackHit(e, ATTACKS.superFlurry, true, player.dir);
            }
          }
        } else if (player.superStep === 7 && player.superTimer >= 0.18 + 7 * interval + 0.12) {
          player.superStep = 8;
          addArc(player.x + player.dir * 42, player.y - 34, player.dir, 'mega', '#f97316');
          addRing(player.x + player.dir * 52, player.y - 34, 130, '#f97316', 6);
          for (const e of enemies) {
            if (e.state === 'dead') continue;
            const d = (e.x - player.x) * player.dir;
            if (d > -40 && d < 190) {
              handleAttackHit(e, ATTACKS.superFinisher, true, player.dir);
            }
          }
        } else if (player.superTimer >= 1.15) {
          player.state = 'idle';
        }
      } else if (player.state === 'parry') {
        player.parryTimer -= dt;
        player.vx *= Math.pow(0.02, dt);
        if (player.parryTimer <= 0) player.state = 'idle';
      } else if (player.state === 'dash') {
        player.dashTimer -= dt;
        if (Math.random() < 0.78) addAfterimage(player, hasUpgrade('phantom') ? '#a855f7' : '#fb923c');
        if (player.dashTimer <= 0) { player.state = 'idle'; player.vx *= 0.4; }
      } else if (player.state === 'hurt') {
        player.hurtTimer -= dt;
        player.vx *= Math.pow(0.05, dt);
        if (player.hurtTimer <= 0) player.state = 'idle';
      } else if (player.state === 'attack') {
        const atk = ATTACKS[player.attackKey];
        player.attackTime += dt;
        if (player.attackKey === 'airSlam') {
          if (Math.random() < 0.8) addAfterimage(player, '#f97316');
          if (player.onGround) {
            triggerShake(16, 0, 1);
            addRing(player.x, GROUND_Y - 6, 135, '#f97316', 5);
            addDecal('crack', player.x, 48);
            flashEnvLight(player.x, GROUND_Y - 12, '#f97316', 0.42);
            addDust(player.x, GROUND_Y, 14, 0);
            sfx.hit(2.4);
            for (const e of enemies) {
              if (e.state !== 'dead' && Math.abs(e.x - player.x) <= atk.reach && Math.abs(e.y - player.y) < 95) {
                handleAttackHit(e, atk, true);
              }
            }
            hitCheckProps(player.x - atk.reach, atk.reach * 2, player.dir, true);
            applySquash(player, 1.4, 0.65);
            player.state = 'idle'; player.vx = 0;
          }
        } else {
          player.vx *= Math.pow(0.015, dt);
          if (player.attackTime >= atk.startup && player.attackTime <= atk.startup + atk.active) {
            const boxX = player.dir === 1 ? player.x + 8 : player.x - 8 - atk.reach;
            const boxY = player.y - atk.height - 6;
            for (const e of enemies) {
              if (e.state === 'dead' || player.attackHitIds.has(e.id)) continue;
              const ex1 = e.x - e.w * 0.5, ex2 = e.x + e.w * 0.5;
              const ey1 = e.y - e.h, ey2 = e.y;
              if (ex2 >= boxX && ex1 <= boxX + atk.reach && ey2 >= boxY && ey1 <= player.y + 8) {
                player.attackHitIds.add(e.id);
                handleAttackHit(e, atk);
              }
            }
            // Deflect enemy projectiles with attacks too!
            for (const pr of projectiles) {
              if (!pr.friendly && pr.x >= boxX && pr.x <= boxX + atk.reach && Math.abs(pr.y - (player.y - 34)) < 44) {
                pr.friendly = true;
                pr.vx = player.dir * Math.abs(pr.vx) * 1.45;
                sfx.parry(); triggerHitStop(0.055);
                addSparks(pr.x, pr.y, 12, player.dir, 0, '#38bdf8', 320, 3.5);
                addFloatText(pr.x, pr.y - 24, '打飞飞镖!', '#38bdf8', 1.0);
                gainEx(12);
              }
            }
            hitCheckProps(boxX, atk.reach, player.dir, atk.power >= 2);
          }
          if (player.attackTime >= atk.startup + atk.active + atk.recovery) {
            player.state = 'idle'; player.attackKey = null;
          }
        }
      } else if (player.state === 'charge') {
        if (moveAxis !== 0) player.dir = moveAxis;
      } else {
        const targetVx = moveAxis * (player.slowTimer > 0 ? 185 : 335);
        player.vx += (targetVx - player.vx) * Math.min(1, dt * 18);
        if (moveAxis !== 0) { player.dir = moveAxis; player.state = 'run'; }
        else player.state = 'idle';
      }

      const wasOnGround = player.onGround;
      player.vy += GRAVITY * dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y; player.vy = 0; player.onGround = true;
        player.airJumps = 1; player.airComboCount = 0;
        if (!wasOnGround) { applySquash(player, 1.24, 0.78); addDust(player.x, GROUND_Y, 6, 0); }
      } else player.onGround = false;

      player.x = Math.max(WALL_L, Math.min(WALL_R, player.x));

      // Headband cloth physics
      player.bandPoints[0].x = player.x - player.dir * 6;
      player.bandPoints[0].y = player.y - 54 * player.scaleY;
      for (let i = 1; i < player.bandPoints.length; i++) {
        const prev = player.bandPoints[i - 1], pt = player.bandPoints[i];
        pt.x += (-player.dir * 58 - player.vx * 0.14) * dt;
        pt.y += (Math.sin(player.animTime * 14 + i) * 26 + 16) * dt;
        const dx = pt.x - prev.x, dy = pt.y - prev.y, d = Math.hypot(dx, dy) || 1;
        pt.x = prev.x + (dx / d) * 6.5; pt.y = prev.y + (dy / d) * 6.5;
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.animTime += dt;
        if (e.flashTimer > 0) e.flashTimer -= dt;
        if (e.hitJitterTimer > 0) e.hitJitterTimer -= dt;
        e.scaleX += (1 - e.scaleX) * Math.min(1, dt * 14);
        e.scaleY += (1 - e.scaleY) * Math.min(1, dt * 14);

        // Hover Boss (Arcane Mage) floats when active, drops to ground when stunned/hurt/dead!
        if (e.isHover && e.state !== 'stunned' && e.state !== 'hurt' && e.state !== 'dead') {
          const targetY = GROUND_Y - 76 + Math.sin(e.animTime * 4.2) * 14;
          e.y += (targetY - e.y) * Math.min(1, dt * 6);
          e.vy = 0;
          e.x += e.vx * dt;
        } else {
          e.vy += GRAVITY * dt;
          e.x += e.vx * dt;
          e.y += e.vy * dt;
        }

        // Fortress Boss shield recharge
        if (e.type === 'boss_fortress' && !e.hasShield && e.state !== 'dead' && e.state !== 'stunned') {
          e.shieldRegenTimer -= dt;
          if (e.shieldRegenTimer <= 0) {
            e.hasShield = true; e.shieldHp = 2;
            addRing(e.x, e.y - 46, 86, '#38bdf8', 5);
            addFloatText(e.x, e.y - 108, '能量巨盾重构!', '#38bdf8', 1.15);
            sfx.chargeReady();
          }
        }

        // Ground collision
        if (e.y >= GROUND_Y) {
          const hitHard = e.vy > 240;
          e.y = GROUND_Y; e.vy = 0;
          if (hitHard) {
            applySquash(e, 1.32, 0.72);
            addDust(e.x, GROUND_Y, 6, 0);
            // Boss Jump Slam Shockwave!
            if (e.isBoss && e.state === 'strike' && e.subAttack === 'slam') {
              triggerShake(18, 0, 1);
              sfx.explosion();
              addRing(e.x, GROUND_Y - 6, 130, '#ef4444', 5);
              addDecal('crack', e.x, 66);
              flashEnvLight(e.x, GROUND_Y - 14, '#ef4444', 0.55);
              const swSpd = e.phase >= 2 ? 410 : 340;
              const swDmg = Math.round(e.dmg * 0.8);
              shockwaves.push({ x: e.x, vx: -swSpd, life: 0.95, maxLife: 0.95, dmg: swDmg });
              shockwaves.push({ x: e.x, vx: swSpd,  life: 0.95, maxLife: 0.95, dmg: swDmg });
              if (Math.abs(player.x - e.x) < 96 && player.y > GROUND_Y - 35) {
                damagePlayer(e.dmg, player.x >= e.x ? 1 : -1, e);
              }
              e.state = 'recover'; e.stateTimer = e.phase >= 2 ? 0.52 : 0.7; e.subAttack = '';
            }
          }
          if (e.state === 'hurt' || e.state === 'stunned' || e.state === 'dead') e.vx *= Math.pow(0.012, dt);
        }

        // Wall Bounce!
        if (e.x < WALL_L || e.x > WALL_R) {
          const hitLeft = e.x < WALL_L;
          e.x = hitLeft ? WALL_L : WALL_R;
          if (e.isBoss && e.state === 'strike' && e.subAttack === 'charge') {
            // Boss crashed into wall -> self stunned!
            if (hitLeft) wallHitFlash.left = 1; else wallHitFlash.right = 1;
            flashEnvLight(e.x, e.y - 45, '#facc15', 0.45);
            e.vx = (hitLeft ? 1 : -1) * 180; e.vy = -160;
            e.state = 'stunned'; e.stateTimer = 1.75; e.subAttack = '';
            triggerShake(16, hitLeft ? -1 : 1, 0); sfx.hit(2.5);
            addFloatText(e.x + (hitLeft ? 50 : -50), e.y - 100, '撞墙眩晕! 快打!', '#facc15', 1.25);
          } else if (Math.abs(e.vx) > 250 && (e.wallBounceArmed || e.state === 'hurt')) {
            if (hitLeft) wallHitFlash.left = 1; else wallHitFlash.right = 1;
            e.wallBounceArmed = false;
            e.vx = -e.vx * 0.54; e.vy = -275;
            const wbDmg = 12 + hasUpgrade('wallcrush') * 12;
            if (e.type !== 'dummy') e.hp = Math.max(0, e.hp - wbDmg);
            if (hasUpgrade('wallcrush')) gainEx(8 * hasUpgrade('wallcrush'));
            applySquash(e, 0.58, 1.42);
            triggerHitStop(0.055);
            triggerShake(11, hitLeft ? -1 : 1, 0);
            addRing(e.x, e.y - 34, 62, '#fb923c', 4);
            addSparks(e.x, e.y - 34, 12, hitLeft ? 1 : -1, -0.3, '#fb923c', 280, 3.5);
            addFloatText(e.x + (hitLeft ? 34 : -34), e.y - 68, `撞墙 +${wbDmg}`, '#fb923c', 1.05);
            sfx.hit(1.7);
          } else e.vx = 0;
        }

        if (e.state === 'dead') { e.deadAlpha -= dt * 1.3; if (e.deadAlpha <= 0) enemies.splice(i, 1); continue; }
        if (e.buffTimer > 0) {
          e.buffTimer -= dt;
          if (feel.vfx && Math.random() < 0.22) {
