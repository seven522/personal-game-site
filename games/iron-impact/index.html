              } else {
                if (e.phase >= 2 && r < 0.32) { e.subAttack = 'flameDash'; e.stateTimer = 0.4; addFloatText(e.x, e.y - 88, '共鸣焰冲!', '#f97316', 1.0); }
                else if (r < 0.55) { e.subAttack = 'iceVolley'; e.stateTimer = 0.42; addFloatText(e.x, e.y - 88, '寒冰齐射! (可弹反)', '#22d3ee', 1.0); }
                else { e.subAttack = 'frostZone'; e.stateTimer = 0.46; addFloatText(e.x, e.y - 88, '霜冻减速阵!', '#22d3ee', 1.0); }
              }
              applySquash(e, 1.18, 0.85);
            }
          }
          continue;
        }

        // ==================== REGULAR & BUFFER ENEMY AI ====================
        if (e.type === 'buffer') {
          e.dir = dist >= 0 ? 1 : -1;
          e.drumCooldown -= dt;
          if (e.state === 'windup') {
            e.vx *= Math.pow(0.05, dt); e.stateTimer -= dt;
            if (e.stateTimer <= 0) {
              // Cast War Drum Buff to all allies!
              addRing(e.x, e.y - 36, 170, '#f59e0b', 5);
              flashEnvLight(e.x, e.y - 36, '#f59e0b', 0.36);
              sfx.chargeReady();
              let buffed = 0, lowestAlly = null;
              for (const ally of enemies) {
                if (ally !== e && ally.state !== 'dead') {
                  ally.buffTimer = 5.5;
                  buffed++;
                  if (!lowestAlly || (ally.hp / ally.maxHp) < (lowestAlly.hp / lowestAlly.maxHp)) lowestAlly = ally;
                }
              }
              if (lowestAlly && lowestAlly.hp < lowestAlly.maxHp) {
                const hAmt = Math.round(lowestAlly.maxHp * 0.16);
                lowestAlly.hp = Math.min(lowestAlly.maxHp, lowestAlly.hp + hAmt);
                addFloatText(lowestAlly.x, lowestAlly.y - 78, `+${hAmt} HP`, '#22c55e', 0.9);
              }
              addFloatText(e.x, e.y - 84, buffed > 0 ? '战鼓狂暴! 全队ATK+35%' : '战鼓蓄势!', '#facc15', 1.05);
              e.state = 'recover'; e.stateTimer = 0.45; e.drumCooldown = 4.2;
            }
          } else if (e.state === 'recover') {
            e.vx *= Math.pow(0.05, dt); e.stateTimer -= dt;
            if (e.stateTimer <= 0) e.state = 'idle';
          } else {
            // Keep safe distance behind frontliners
            if (absDist < 230) e.vx += (-e.dir * e.speed - e.vx) * Math.min(1, dt * 8);
            else if (absDist > 360) e.vx += (e.dir * e.speed * 0.7 - e.vx) * Math.min(1, dt * 6);
            else e.vx *= Math.pow(0.05, dt);
            if (e.drumCooldown <= 0) {
              e.state = 'windup'; e.stateTimer = 0.62;
              applySquash(e, 1.15, 0.88);
            }
          }
          continue;
        }

        if (e.state === 'windup') {
          e.vx *= Math.pow(0.05, dt); e.stateTimer -= dt;
          if (e.stateTimer <= 0) {
            e.state = 'strike'; e.stateTimer = 0.14;
            if (e.type === 'striker') {
              projectiles.push({ x: e.x + e.dir * 20, y: e.y - 36, vx: e.dir * 405, dmg: effDmg, friendly: false, owner: e, rot: 0 });
              if (wave >= 4 || e.buffTimer > 0) {
                projectiles.push({ x: e.x + e.dir * 10, y: e.y - 52, vx: e.dir * 355, dmg: effDmg, friendly: false, owner: e, rot: 0 });
              }
              sfx.whoosh(1.6);
            } else {
              e.vx = e.dir * (e.type === 'acrobat' ? 340 : e.isHeavy ? 255 : 205);
              if (e.type === 'acrobat' && e.y >= GROUND_Y) e.vy = -250;
              sfx.whoosh(0.95);
              if (absDist < (e.isHeavy ? 84 : 68) && Math.abs(player.y - e.y) < 58) damagePlayer(effDmg, e.dir, e);
            }
          }
        } else if (e.state === 'strike') {
          e.vx *= Math.pow(0.05, dt); e.stateTimer -= dt;
          if (e.stateTimer <= 0) { e.state = 'recover'; e.stateTimer = e.isHeavy ? 0.45 : 0.34; }
        } else if (e.state === 'recover') {
          e.vx *= Math.pow(0.05, dt); e.stateTimer -= dt;
          if (e.stateTimer <= 0) {
            const cd = (0.26 + Math.random() * 0.32) * (e.buffTimer > 0 ? 0.72 : 1);
            e.state = 'idle'; e.aiCooldown = cd;
          }
        } else {
          e.dir = dist >= 0 ? 1 : -1;
          e.aiCooldown -= dt;
          if (e.type === 'striker') {
            const ideal = 255;
            if (absDist < 175) e.vx += (-e.dir * effSpeed - e.vx) * Math.min(1, dt * 7);
            else if (absDist > ideal + 40) e.vx += (e.dir * effSpeed - e.vx) * Math.min(1, dt * 7);
            else e.vx *= Math.pow(0.05, dt);
            if (e.aiCooldown <= 0 && absDist < 440) {
              e.state = 'windup'; e.stateTimer = e.buffTimer > 0 ? 0.36 : 0.44; applySquash(e, 1.16, 0.88);
            }
          } else {
            const range = e.type === 'acrobat' ? 118 : e.isHeavy ? 76 : 62;
            if (absDist > range) e.vx += (e.dir * effSpeed - e.vx) * Math.min(1, dt * 8);
            else {
              e.vx *= Math.pow(0.05, dt);
              if (e.aiCooldown <= 0) {
                const wu = (e.isHeavy ? 0.46 : e.type === 'acrobat' ? 0.31 : 0.36) * (e.buffTimer > 0 ? 0.82 : 1);
                e.state = 'windup'; e.stateTimer = wu;
                applySquash(e, 1.18, 0.86);
              }
            }
          }
        }
      }
    }

    function updateHazards(dt) {
      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        if (h.kind === 'slashLine') {
          h.timer -= dt;
          if (h.timer <= 0) hazards.splice(i, 1);
        } else if (h.kind === 'pillar' || h.kind === 'lightningStrike') {
          if (h.timer > 0) {
            h.timer -= dt;
            if (h.timer <= 0) {
              if (h.kind === 'lightningStrike') {
                sfx.lightning(); triggerShake(9, 0, 0.5);
                addLightning(h.x, 0, GROUND_Y);
                addSparks(h.x, GROUND_Y - 16, 12, 0, -1, '#38bdf8', 360, 4);
                flashEnvLight(h.x, GROUND_Y - 90, '#38bdf8', 0.42);
              } else {
                sfx.explosion(); triggerShake(10, 0, -0.6);
                addDecal('scorch', h.x, 34);
                addSparks(h.x, GROUND_Y - 24, 14, 0, -1, '#facc15', 380, 4);
                flashEnvLight(h.x, GROUND_Y - 50, '#f97316', 0.38);
              }
            }
          } else {
            h.activeTimer -= dt;
            const hitH = h.kind === 'lightningStrike' ? 300 : 115;
            if (!h.hit && Math.abs(player.x - h.x) < 34 && player.y > GROUND_Y - hitH) {
              h.hit = true;
              damagePlayer(h.dmg, player.x >= h.x ? 1 : -1, null);
            }
            if (h.activeTimer <= 0) hazards.splice(i, 1);
          }
        } else if (h.kind === 'nova') {
          h.life -= dt;
          const p = 1 - h.life / h.maxLife;
          h.r = 16 + (h.maxR - 16) * p;
          if (!h.hit && Math.hypot(player.x - h.x, (player.y - 32) - h.y) < h.r) {
            h.hit = true;
            damagePlayer(h.dmg, player.x >= h.x ? 1 : -1, null);
          }
          if (h.life <= 0) hazards.splice(i, 1);
        } else if (h.kind === 'beam') {
          h.life -= dt;
          const inDir = h.dir === 1 ? (player.x >= h.x) : (player.x <= h.x);
          if (!h.hit && inDir && Math.abs((player.y - 32) - h.y) < 32) {
            h.hit = true;
            damagePlayer(h.dmg, h.dir, null);
          }
          if (h.life <= 0) hazards.splice(i, 1);
        } else if (h.kind === 'frost') {
          h.life -= dt;
          if (Math.abs(player.x - h.x) < h.r && player.y > GROUND_Y - 22) {
            player.slowTimer = 0.28;
            h.tick -= dt;
            if (h.tick <= 0) {
              h.tick = 0.85;
              damagePlayer(h.dmg, player.x >= h.x ? 1 : -1, null);
            }
          }
          if (h.life <= 0) hazards.splice(i, 1);
        }
      }
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        if (pr.life !== undefined) { pr.life -= dt; if (pr.life <= 0) { projectiles.splice(i, 1); continue; } }
        if (pr.homing && !pr.friendly) {
          const dx = player.x - pr.x, dy = (player.y - 34) - pr.y;
          const d = Math.hypot(dx, dy) || 1;
          pr.vx += (dx / d) * 320 * dt;
          pr.vy = (pr.vy || 0) + (dy / d) * 320 * dt;
          const spd = Math.hypot(pr.vx, pr.vy);
          if (spd > 280) { pr.vx = (pr.vx / spd) * 280; pr.vy = (pr.vy / spd) * 280; }
        }
        if (pr.gravity) pr.vy = (pr.vy || 0) + GRAVITY * dt;
        pr.x += pr.vx * dt;
        pr.y += (pr.vy || 0) * dt;
        pr.rot += dt * 22;

        // Mortar bomb hits ground -> AoE Explosion!
        if (pr.kind === 'bomb' && pr.y >= GROUND_Y) {
          sfx.explosion(); triggerShake(11, 0, 0.5);
          addRing(pr.x, GROUND_Y - 8, 86, '#f97316', 5);
          addDecal('scorch', pr.x, 34);
          addSparks(pr.x, GROUND_Y - 12, 14, 0, -1, '#facc15', 340, 4);
          if (Math.abs(player.x - pr.x) < 76 && player.y > GROUND_Y - 68) {
            damagePlayer(pr.dmg, player.x >= pr.x ? 1 : -1, null);
          }
          projectiles.splice(i, 1);
          continue;
        }

        if (pr.x < WALL_L - 24 || pr.x > WALL_R + 24 || pr.y > GROUND_Y + 20) { projectiles.splice(i, 1); continue; }

        if (!pr.friendly) {
          if (Math.abs(pr.x - player.x) < 28 && Math.abs(pr.y - (player.y - 34)) < 36) {
            const res = damagePlayer(pr.dmg, pr.vx > 0 ? 1 : -1, null);
            if (res === 'parried') {
              pr.friendly = true;
              pr.homing = false;
              pr.gravity = false;
              if (pr.owner && pr.owner.state !== 'dead') {
                const dx = pr.owner.x - pr.x, dy = (pr.owner.y - pr.owner.h * 0.5) - pr.y;
                const d = Math.hypot(dx, dy) || 1;
                pr.vx = (dx / d) * 620; pr.vy = (dy / d) * 620;
              } else {
                pr.vx = -pr.vx * 1.65; pr.vy = 0;
              }
              addFloatText(pr.x, pr.y - 32, '完美反弹!!', '#facc15', 1.2);
            } else if (res === 'hit') {
              projectiles.splice(i, 1);
            }
          }
        } else {
          for (const e of enemies) {
            if (e.state !== 'dead' && Math.abs(pr.x - e.x) < e.w * 0.6 + 16 && Math.abs(pr.y - (e.y - e.h * 0.5)) < 46) {
              const isOrb = pr.kind === 'orb';
              handleAttackHit(e, { dmg: isOrb ? 56 : 38, posture: isOrb ? 65 : 35, hitstop: 0.09, kbX: 380, kbY: isOrb ? 220 : -220, shake: 14, color: '#38bdf8', power: 2.2, guardBreak: true, exGain: 8 }, true, pr.vx > 0 ? 1 : -1);
              e.state = 'stunned'; e.stateTimer = isOrb ? 2.8 : 1.6;
              if (isOrb && e.isHover) addFloatText(e.x, e.y - 94, '雷球击落!! 速攻!', '#facc15', 1.25);
              projectiles.splice(i, 1);
              break;
            }
          }
        }
      }
    }

    function updateShockwaves(dt) {
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.x += s.vx * dt; s.life -= dt;
        if (s.life <= 0 || s.x < WALL_L || s.x > WALL_R) { shockwaves.splice(i, 1); continue; }
        if (Math.abs(s.x - player.x) < 26 && player.y > GROUND_Y - 26) {
          const res = damagePlayer(s.dmg, s.vx > 0 ? 1 : -1, null);
          if (res !== 'evaded') shockwaves.splice(i, 1);
        }
      }
    }

    function updateProps(dt) {
      for (let i = props.length - 1; i >= 0; i--) {
        const p = props[i];
        if (p.flashTimer > 0) p.flashTimer -= dt;
        p.scaleX += (1 - p.scaleX) * Math.min(1, dt * 14);
        p.scaleY += (1 - p.scaleY) * Math.min(1, dt * 14);
        p.vy += GRAVITY * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.y >= GROUND_Y) { p.y = GROUND_Y; p.vy = 0; p.vx *= Math.pow(0.06, dt); }
        if (p.flying) {
          // Hit wall -> explode
          if (p.x <= WALL_L + 10 || p.x >= WALL_R - 10) { explodeBarrel(p); continue; }
          // Hit enemy -> explode!
          let hit = false;
          for (const e of enemies) {
            if (e.state !== 'dead' && Math.abs(e.x - p.x) < e.w * 0.5 + 18) { hit = true; break; }
          }
          if (hit) { explodeBarrel(p); continue; }
          if (Math.abs(p.vx) < 40) p.flying = false;
        }
      }
    }

    function updatePickups(dt) {
      for (let i = pickups.length - 1; i >= 0; i--) {
        const pk = pickups[i];
        pk.life -= dt; pk.anim += dt;
        pk.vy += GRAVITY * dt; pk.x += pk.vx * dt; pk.y += pk.vy * dt;
        if (pk.y >= GROUND_Y) { pk.y = GROUND_Y; pk.vy = -pk.vy * 0.35; pk.vx *= 0.6; }
        pk.x = Math.max(WALL_L + 16, Math.min(WALL_R - 16, pk.x));
        if (pk.life <= 0) { pickups.splice(i, 1); continue; }
        if (Math.abs(pk.x - player.x) < 34 && Math.abs(pk.y - player.y) < 48) {
          sfx.pickup();
          if (pk.kind === 'heal') {
            player.hp = Math.min(player.maxHp, player.hp + 22);
            restoreStamina(35, true);
            addFloatText(player.x, player.y - 76, '+22 HP +SP', '#22c55e', 1.15);
          } else {
            gainEx(25);
            restoreStamina(35, true);
            addFloatText(player.x, player.y - 76, '+25 EX +SP!', '#facc15', 1.15);
          }
          addRing(pk.x, pk.y - 12, 42, pk.kind === 'heal' ? '#22c55e' : '#facc15', 3);
          pickups.splice(i, 1);
        }
      }
    }

    function updateVFX(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.vy += p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.rot !== undefined) p.rot += p.vrot * dt;
        if (p.y > GROUND_Y && p.kind === 'shard') { p.y = GROUND_Y; p.vy *= -0.4; p.vx *= 0.7; }
      }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.life -= dt;
        if (r.life <= 0) { rings.splice(i, 1); continue; }
        r.r = 8 + (r.maxR - 8) * (1 - Math.pow(r.life / r.maxLife, 3));
      }
      for (let i = arcs.length - 1; i >= 0; i--) { arcs[i].life -= dt; if (arcs[i].life <= 0) arcs.splice(i, 1); }
      for (let i = floatTexts.length - 1; i >= 0; i--) { const f = floatTexts[i]; f.life -= dt; f.y += f.vy * dt; f.vy *= Math.pow(0.1, dt); if (f.life <= 0) floatTexts.splice(i, 1); }
      for (let i = afterimages.length - 1; i >= 0; i--) { afterimages[i].life -= dt; if (afterimages[i].life <= 0) afterimages.splice(i, 1); }
      for (let i = lightnings.length - 1; i >= 0; i--) { lightnings[i].life -= dt; if (lightnings[i].life <= 0) lightnings.splice(i, 1); }
    }

    // ==================== Rendering ====================
    function drawStage(pal, biome) {
      const px = (player.x - W / 2) / (W / 2); // -1..1 parallax factor
      const t = envTime;
      const l = isLightTheme;

      // 1. Rich Multi-Stop Sky Gradient
      const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      if (biome === 0) {
        grad.addColorStop(0, l ? '#dbeafe' : '#050814');
        grad.addColorStop(0.55, l ? '#cbd5e1' : '#0f1833');
        grad.addColorStop(1, l ? '#94a3b8' : '#1b2847');
      } else if (biome === 1) {
        grad.addColorStop(0, l ? '#fee2e2' : '#110608');
        grad.addColorStop(0.6, l ? '#fecaca' : '#2a0d12');
        grad.addColorStop(1, l ? '#fca5a5' : '#4c1614');
      } else {
        grad.addColorStop(0, l ? '#fef3c7' : '#1a0c26');
        grad.addColorStop(0.5, l ? '#fed7aa' : '#581c36');
        grad.addColorStop(1, l ? '#fdba74' : '#9a3412');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, GROUND_Y);

      // 2. Far & Mid Parallax Biome Architecture
      if (biome === 0) {
        // --- BIOME 0: NEON RAIN ALLEY ---
        // Horizon cyan/magenta urban glow
        const hGlow = ctx.createRadialGradient(W * 0.5 - px * 14, GROUND_Y, 20, W * 0.5 - px * 14, GROUND_Y, 440);
        hGlow.addColorStop(0, l ? 'rgba(56,189,248,0.18)' : 'rgba(56,189,248,0.22)');
        hGlow.addColorStop(0.5, l ? 'rgba(244,114,182,0.08)' : 'rgba(236,72,153,0.12)');
        hGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = hGlow;
        ctx.fillRect(0, 0, W, GROUND_Y);

        // Far Skyline (0.1x parallax)
        ctx.save();
        ctx.translate(-px * 11, 0);
        for (const b of SKYLINE) {
          ctx.fillStyle = l ? 'rgba(71,85,105,0.28)' : '#0a1022';
          ctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
          // Lit windows grid
          ctx.fillStyle = b.win;
          ctx.globalAlpha = l ? 0.22 : 0.34;
          for (let wy = GROUND_Y - b.h + 12; wy < GROUND_Y - 18; wy += 16) {
            for (let wx = b.x + 10; wx < b.x + b.w - 12; wx += 14) {
              if (((wx * 7 + wy * 13) % 11) > 4) ctx.fillRect(wx, wy, 6, 8);
            }
          }
          // Rooftop aviation beacon
          ctx.globalAlpha = 0.45 + Math.sin(t * 3 + b.x) * 0.4;
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.arc(b.x + b.w * 0.5, GROUND_Y - b.h - 3, 2.2, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.restore();

        // Mid Alley Overpass, Columns, Volumetric Streetlamps & Neon Signs (0.26x parallax)
        ctx.save();
        ctx.translate(-px * 25, 0);
        // Elevated highway beam
        ctx.fillStyle = l ? 'rgba(51,65,85,0.2)' : '#121a30';
        ctx.fillRect(-40, 26, W + 80, 18);
        for (let x = 70; x < W; x += 190) {
          ctx.fillRect(x, 44, 24, GROUND_Y - 44);
          // Streetlamp volumetric light cone
          const cone = ctx.createLinearGradient(x + 12, 54, x + 12, GROUND_Y);
          cone.addColorStop(0, l ? 'rgba(56,189,248,0.16)' : 'rgba(56,189,248,0.22)');
          cone.addColorStop(1, 'rgba(56,189,248,0)');
          ctx.fillStyle = cone;
          ctx.beginPath();
          ctx.moveTo(x + 4, 54); ctx.lineTo(x + 20, 54);
          ctx.lineTo(x + 76, GROUND_Y); ctx.lineTo(x - 52, GROUND_Y);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#e0f2fe';
          ctx.fillRect(x + 5, 50, 14, 4);
        }

        // Glowing Neon Signs
        const signs = [
          { x: 145, y: 84, w: 96, h: 36, text: '铁拳馆', col: '#38bdf8', flick: 1 },
          { x: 430, y: 66, w: 112, h: 34, text: '武道 24H', col: '#f472b6', flick: (Math.sin(t * 27) > -0.82 ? 1 : 0.35) },
          { x: 705, y: 90, w: 84, h: 34, text: '深夜拉面', col: '#fbbf24', flick: 0.88 + Math.sin(t * 4) * 0.12 },
        ];
        for (const s of signs) {
          ctx.save();
          ctx.globalAlpha = s.flick;
          // Soft bloom behind sign
          const sg = ctx.createRadialGradient(s.x + s.w / 2, s.y + s.h / 2, 4, s.x + s.w / 2, s.y + s.h / 2, 74);
          sg.addColorStop(0, s.col + '44'); sg.addColorStop(1, s.col + '00');
          ctx.fillStyle = sg; ctx.fillRect(s.x - 45, s.y - 45, s.w + 90, s.h + 90);
          ctx.fillStyle = l ? 'rgba(15,23,42,0.78)' : 'rgba(6,10,22,0.88)';
          ctx.strokeStyle = s.col; ctx.lineWidth = 2.2;
          ctx.beginPath(); ctx.roundRect(s.x, s.y, s.w, s.h, 5); ctx.fill(); ctx.stroke();
          ctx.font = '800 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = s.col;
          ctx.fillText(s.text, s.x + s.w / 2, s.y + 23);
          ctx.restore();
        }
        ctx.restore();

      } else if (biome === 1) {
        // --- BIOME 1: MOLTEN STEEL CAGE (BOSS ARENA) ---
        // Magma furnace under-glow
        const mGlow = ctx.createLinearGradient(0, GROUND_Y - 140, 0, GROUND_Y);
        mGlow.addColorStop(0, 'rgba(239,68,68,0)');
        mGlow.addColorStop(1, l ? 'rgba(220,38,38,0.22)' : 'rgba(249,115,22,0.34)');
        ctx.fillStyle = mGlow; ctx.fillRect(0, GROUND_Y - 140, W, 140);

        // Far Molten Lava Waterfalls (0.1x parallax)
        ctx.save();
        ctx.translate(-px * 10, 0);
        [210, 680].forEach((lx, idx) => {
          const pulse = 0.78 + Math.sin(t * 4.5 + idx * 2) * 0.22;
          ctx.fillStyle = l ? 'rgba(127,29,29,0.2)' : '#1c0c0e';
          ctx.beginPath(); ctx.roundRect(lx - 34, 34, 68, GROUND_Y - 34, [34, 34, 0, 0]); ctx.fill();
          const lg = ctx.createLinearGradient(lx, 54, lx, GROUND_Y);
          lg.addColorStop(0, '#facc15'); lg.addColorStop(0.5, '#f97316'); lg.addColorStop(1, '#dc2626');
          ctx.fillStyle = lg; ctx.globalAlpha = (l ? 0.5 : 0.72) * pulse;
          ctx.fillRect(lx - 14, 54, 28, GROUND_Y - 54);
          // Flowing bright lava streaks
          ctx.fillStyle = '#fef08a';
          for (let k = 0; k < 4; k++) {
            const sy = 56 + ((t * 110 + k * 62 + idx * 30) % (GROUND_Y - 62));
            ctx.fillRect(lx - 5 + (k % 2) * 5, sy, 4, 22);
          }
          ctx.globalAlpha = 1;
        });
        ctx.restore();

        // Mid Steel Cage Diamond Wire Mesh + Swaying Iron Chains + Sweeping Spotlights
        ctx.save();
        ctx.translate(-px * 24, 0);
        // Diamond cage mesh
        ctx.strokeStyle = l ? 'rgba(127,29,29,0.14)' : 'rgba(248,113,113,0.13)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let x = -GROUND_Y; x < W + GROUND_Y; x += 28) {
          ctx.moveTo(x, 30); ctx.lineTo(x + GROUND_Y - 30, GROUND_Y);
          ctx.moveTo(x + GROUND_Y - 30, 30); ctx.lineTo(x, GROUND_Y);
        }
        ctx.stroke();

        // Heavy Steel Girders
        ctx.fillStyle = l ? 'rgba(87,83,78,0.45)' : '#1c1917';
        ctx.fillRect(-40, 0, W + 80, 26);
        for (let x = 90; x < W; x += 185) ctx.fillRect(x, 26, 16, GROUND_Y - 26);

        // Swaying Hanging Chains
        [165, 360, 560, 760].forEach((cx, i) => {
          const sway = Math.sin(t * 2.1 + i * 1.4) * 9;
          const len = 85 + (i % 2) * 34;
          ctx.strokeStyle = l ? 'rgba(68,64,60,0.45)' : '#57534e';
          ctx.lineWidth = 3;
          ctx.setLineDash([7, 4]);
          ctx.beginPath(); ctx.moveTo(cx, 24); ctx.quadraticCurveTo(cx + sway * 0.5, 24 + len * 0.5, cx + sway, 24 + len); ctx.stroke();
          ctx.setLineDash([]);
        });

        // Twin Sweeping Volumetric Spotlights
        [240, 680].forEach((sx, idx) => {
          const sweep = Math.sin(t * 1.3 + idx * 3.1) * 140;
          const beam = ctx.createLinearGradient(sx, 20, sx + sweep, GROUND_Y);
          beam.addColorStop(0, l ? 'rgba(251,146,60,0.18)' : 'rgba(254,240,138,0.16)');
          beam.addColorStop(1, 'rgba(254,240,138,0)');
          ctx.fillStyle = beam;
          ctx.beginPath();
          ctx.moveTo(sx - 10, 20); ctx.lineTo(sx + 10, 20);
          ctx.lineTo(sx + sweep + 85, GROUND_Y); ctx.lineTo(sx + sweep - 85, GROUND_Y);
          ctx.closePath(); ctx.fill();
        });
        ctx.restore();

      } else {
        // --- BIOME 2: SUNSET ANCIENT DOJO ---
        // Far Giant Setting Sun + Drifting Clouds + Ink Mountains (0.09x parallax)
        ctx.save();
        ctx.translate(-px * 9, 0);
        const sunX = W * 0.5, sunY = GROUND_Y - 68;
        const sunHalo = ctx.createRadialGradient(sunX, sunY, 30, sunX, sunY, 175);
        sunHalo.addColorStop(0, l ? 'rgba(249,115,22,0.42)' : 'rgba(251,146,60,0.52)');
        sunHalo.addColorStop(0.55, l ? 'rgba(251,146,60,0.14)' : 'rgba(239,68,68,0.18)');
        sunHalo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sunHalo; ctx.fillRect(0, 0, W, GROUND_Y);
        ctx.fillStyle = l ? '#fb923c' : '#fdba74';
        ctx.globalAlpha = l ? 0.55 : 0.78;
        ctx.beginPath(); ctx.arc(sunX, sunY, 72, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;

        // Drifting sunset clouds
        ctx.fillStyle = l ? 'rgba(255,255,255,0.45)' : 'rgba(253,186,116,0.16)';
        for (let c = 0; c < 4; c++) {
          const cx = ((c * 270 + t * (10 + c * 3)) % (W + 220)) - 110;
          const cy = 54 + c * 28;
          ctx.beginPath(); ctx.roundRect(cx, cy, 130 + c * 22, 10, 5); ctx.fill();
        }

        // Layered Mountain Silhouettes
        ctx.fillStyle = l ? 'rgba(154,52,18,0.18)' : '#2b1322';
        ctx.beginPath(); ctx.moveTo(-40, GROUND_Y);
        ctx.lineTo(130, 155); ctx.lineTo(290, 215); ctx.lineTo(470, 145); ctx.lineTo(660, 205); ctx.lineTo(830, 150); ctx.lineTo(W + 40, GROUND_Y);
        ctx.closePath(); ctx.fill();
        ctx.restore();

        // Mid Dojo Roof Eaves, Shoji Paper Doors, Calligraphy Plaque & Swaying Lanterns (0.24x parallax)
        ctx.save();
        ctx.translate(-px * 23, 0);
        // Back Shoji Screen Wall
        ctx.fillStyle = l ? 'rgba(255,247,237,0.68)' : 'rgba(254,215,170,0.12)';
        ctx.fillRect(105, 86, W - 210, GROUND_Y - 86);
        ctx.strokeStyle = l ? 'rgba(120,53,15,0.28)' : 'rgba(251,146,60,0.22)';
        ctx.lineWidth = 1.5;
        for (let sx = 105; sx <= W - 105; sx += 44) { ctx.beginPath(); ctx.moveTo(sx, 86); ctx.lineTo(sx, GROUND_Y); ctx.stroke(); }
        for (let sy = 112; sy < GROUND_Y; sy += 34) { ctx.beginPath(); ctx.moveTo(105, sy); ctx.lineTo(W - 105, sy); ctx.stroke(); }

        // Crimson Wooden Pillars & Curved Eave Beam
        ctx.fillStyle = l ? '#9a3412' : '#451218';
        ctx.fillRect(96, 62, 18, GROUND_Y - 62);
        ctx.fillRect(W - 114, 62, 18, GROUND_Y - 62);
        ctx.beginPath();
        ctx.moveTo(54, 68); ctx.quadraticCurveTo(W / 2, 52, W - 54, 68);
        ctx.lineTo(W - 68, 86); ctx.lineTo(68, 86); ctx.closePath();
        ctx.fill();

        // Dojo Wooden Plaque ("武魂")
        ctx.fillStyle = l ? '#78350f' : '#29120e';
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(W / 2 - 44, 70, 88, 34, 4); ctx.fill(); ctx.stroke();
        ctx.font = '900 18px serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fde68a';
        ctx.fillText('武 魂', W / 2, 93);

        // Swaying Glowing Red Paper Lanterns
        [155, 315, W - 315, W - 155].forEach((lx, idx) => {
          const swing = Math.sin(t * 2.2 + idx * 1.3) * 5;
          const ly = 110;
          const lg = ctx.createRadialGradient(lx + swing, ly, 4, lx + swing, ly, 44);
          lg.addColorStop(0, 'rgba(251,146,60,0.42)'); lg.addColorStop(1, 'rgba(251,146,60,0)');
          ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx + swing, ly, 44, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(lx, 84); ctx.lineTo(lx + swing, ly - 13); ctx.stroke();
          ctx.fillStyle = '#dc2626';
          ctx.beginPath(); ctx.ellipse(lx + swing, ly, 9.5, 13, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fde68a'; ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.ellipse(lx + swing, ly, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        });
        ctx.restore();
      }

      // 3. Ambient Weather Particles (Back layer)
      ctx.save();
      for (const a of ambientParticles) {
        if (biome === 0) {
          ctx.strokeStyle = l ? 'rgba(51,65,85,0.28)' : 'rgba(186,230,253,0.28)';
          ctx.lineWidth = 1.15;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x - 5.5, a.y + 16); ctx.stroke();
        } else if (biome === 1) {
          ctx.fillStyle = Math.sin(a.phase + t * 8) > 0 ? '#facc15' : '#f97316';
          ctx.globalAlpha = 0.65;
          ctx.beginPath(); ctx.arc(a.x, a.y, a.size * 0.72, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = l ? 'rgba(234,88,12,0.52)' : 'rgba(253,164,175,0.62)';
          ctx.beginPath(); ctx.ellipse(a.x, a.y, a.size * 1.55, a.size * 0.65 * Math.abs(Math.cos(a.phase)), a.phase, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();

      // 4. Textured Perspective Floor
      const fGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
      fGrad.addColorStop(0, pal.floorTop); fGrad.addColorStop(1, pal.floorBot);
      ctx.fillStyle = fGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

      if (biome === 0) {
        // Shimmering Neon Reflections on Wet Asphalt!
        const refs = [
          { x: 190 - px * 20, w: 120, col: 'rgba(56,189,248,0.18)' },
          { x: 480 - px * 20, w: 140, col: 'rgba(244,114,182,0.15)' },
          { x: 745 - px * 20, w: 110, col: 'rgba(251,191,36,0.16)' },
        ];
        for (const r of refs) {
          const rg = ctx.createRadialGradient(r.x, GROUND_Y + 24, 6, r.x, GROUND_Y + 24, r.w * 0.7);
          rg.addColorStop(0, r.col); rg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = rg;
          ctx.fillRect(r.x - r.w, GROUND_Y, r.w * 2, H - GROUND_Y);
        }
        // Rain splash ripples on wet street
        ctx.strokeStyle = l ? 'rgba(51,65,85,0.28)' : 'rgba(186,230,253,0.34)';
        ctx.lineWidth = 1;
        for (const rs of rainSplashes) {
          const p = 1 - rs.life / rs.maxLife;
          ctx.globalAlpha = 1 - p;
          ctx.beginPath(); ctx.ellipse(rs.x, rs.y, 2 + p * 11, 1 + p * 3.5, 0, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      } else if (biome === 1) {
        // Glowing lava vents under steel floor grates
        const pulse = 0.55 + Math.sin(t * 4) * 0.25;
        ctx.fillStyle = `rgba(239,68,68,${0.18 * pulse})`;
        for (let x = 95; x < W - 80; x += 170) {
          ctx.fillRect(x, GROUND_Y + 14, 72, 16);
        }
      } else {
        // Golden sunset floor sheen
        const sheen = ctx.createRadialGradient(W * 0.5, GROUND_Y + 12, 10, W * 0.5, GROUND_Y + 12, 260);
        sheen.addColorStop(0, l ? 'rgba(251,146,60,0.22)' : 'rgba(251,146,60,0.24)');
        sheen.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sheen; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      }

      // Horizon & perspective lines
      ctx.strokeStyle = pal.floorLine; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
      ctx.globalAlpha = 0.3; ctx.lineWidth = 1;
      for (let x = 50; x < W; x += 84) {
        ctx.beginPath(); ctx.moveTo(x, GROUND_Y); ctx.lineTo(x + (x - W / 2) * 0.28, H); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // 5. Persistent Battle Decals (Floor Cracks & Scorch Marks)
      for (const d of decals) {
        const a = Math.min(1, d.life / 2.5);
        ctx.save();
        ctx.globalAlpha = a * 0.85;
        if (d.kind === 'scorch') {
          const sg = ctx.createRadialGradient(d.x, GROUND_Y + 6, 3, d.x, GROUND_Y + 6, d.r);
          sg.addColorStop(0, 'rgba(10,10,12,0.85)');
          sg.addColorStop(0.6, 'rgba(67,20,7,0.45)');
          sg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = sg;
          ctx.beginPath(); ctx.ellipse(d.x, GROUND_Y + 6, d.r, d.r * 0.34, 0, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = l ? 'rgba(15,23,42,0.65)' : 'rgba(251,146,60,0.55)';
          ctx.lineWidth = 1.8;
          for (let k = 0; k < 6; k++) {
            const ang = (k / 6) * Math.PI * 2 + d.seed;
            ctx.beginPath();
            ctx.moveTo(d.x, GROUND_Y + 4);
            ctx.lineTo(d.x + Math.cos(ang) * d.r * 0.5, GROUND_Y + 4 + Math.sin(ang) * d.r * 0.16);
            ctx.lineTo(d.x + Math.cos(ang + 0.18) * d.r, GROUND_Y + 4 + Math.sin(ang + 0.18) * d.r * 0.28);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      // 6. Physical Left/Right Wall-Bounce Boundary Pillars
      [
        { x: 0, w: WALL_L - 10, flash: wallHitFlash.left, side: -1 },
        { x: WALL_R + 10, w: W - (WALL_R + 10), flash: wallHitFlash.right, side: 1 },
      ].forEach((wl) => {
        ctx.save();
        ctx.fillStyle = biome === 1 ? '#292524' : biome === 2 ? '#451218' : '#1e293b';
        ctx.fillRect(wl.x, 0, wl.w, H);
        // Hazard / decorative trim stripe along inner edge
        const edgeX = wl.side === -1 ? wl.w - 4 : wl.x;
        ctx.fillStyle = wl.flash > 0.05 ? '#facc15' : pal.floorLine;
        ctx.globalAlpha = wl.flash > 0.05 ? 0.95 : 0.55;
        ctx.fillRect(edgeX, 0, 4, GROUND_Y);
        if (wl.flash > 0.05) {
          const wg = ctx.createRadialGradient(edgeX, GROUND_Y - 50, 4, edgeX, GROUND_Y - 50, 75);
          wg.addColorStop(0, `rgba(251,146,60,${wl.flash * 0.7})`); wg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = wg; ctx.fillRect(edgeX - 75, 0, 150, GROUND_Y);
        }
        ctx.restore();
      });

      // Super Cinematic Darkening
      if (superCinematicAlpha > 0.02) {
        ctx.fillStyle = `rgba(4,6,14,${superCinematicAlpha * 0.72})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawForegroundAtmosphere(pal, biome) {
      // Dynamic Combat Light Flash (Explosion, Lightning, Parry, Super)
      if (envLight.alpha > 0.01 && feel.vfx) {
        ctx.save();
        const lg = ctx.createRadialGradient(envLight.x, envLight.y, 12, envLight.x, envLight.y, 320);
        lg.addColorStop(0, envLight.color);
        lg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = envLight.alpha * 0.42;
        ctx.fillStyle = lg;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }

      // Soft Atmospheric Vignette
      if (!isLightTheme) {
        ctx.save();
        const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.34, W / 2, H / 2, W * 0.62);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(3,6,14,0.38)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }

      // Cinematic Letterbox Bars during Super Move
      if (letterboxAmount > 0.02) {
        const bh = Math.round(28 * letterboxAmount);
        ctx.fillStyle = '#03050a';
        ctx.fillRect(0, 0, W, bh);
        ctx.fillRect(0, H - bh, W, bh);
      }
    }

    function drawFighter(ent, isPlayer, pal, overrideColor = null, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const jitterX = ent.hitJitterTimer > 0 ? (Math.random() - 0.5) * 9 : 0;
      const jitterY = ent.hitJitterTimer > 0 ? (Math.random() - 0.5) * 4 : 0;

      if (!overrideColor) {
        const sScale = Math.max(0.35, 1 - Math.max(0, GROUND_Y - ent.y) / 260);
        ctx.fillStyle = pal.shadow;
        ctx.beginPath();
        ctx.ellipse(ent.x, GROUND_Y + 3, (ent.isBoss ? 34 : 22) * sScale, 6 * sScale, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.translate(ent.x + jitterX, ent.y + jitterY);
      ctx.scale(ent.dir * ent.scaleX, ent.scaleY);

      const flashing = ent.flashTimer > 0;
      const bodyCol = overrideColor || (flashing ? '#ffffff' : (isPlayer ? pal.playerBody : pal[ent.colorKey]));
      const accentCol = overrideColor || (flashing ? '#facc15' : (isPlayer ? pal.playerAccent : '#f8fafc'));
      const h = isPlayer ? 62 : ent.h;
      const runCycle = (Math.abs(ent.vx || 0) > 30 && ent.y >= GROUND_Y - 1) ? Math.sin((ent.animTime || 0) * 15) : 0;

      let lean = 0, punchExt = 0, kickExt = 0, upperExt = 0;
      if (isPlayer) {
        if (ent.state === 'charge') lean = -0.25;
        else if (ent.state === 'dash') lean = 0.34;
        else if (ent.state === 'parry') lean = -0.14;
        else if (ent.state === 'super') { lean = 0.28; punchExt = 1.3; }
        else if (ent.state === 'attack') {
          if (ent.attackKey === 'jab1' || ent.attackKey === 'jab2') { lean = 0.22; punchExt = 1; }
          else if (ent.attackKey === 'chargePunch') { lean = 0.34; punchExt = 1.48; }
          else if (ent.attackKey === 'dashKnee') { lean = 0.35; kickExt = 0.9; }
          else if (ent.attackKey === 'kick3' || ent.attackKey === 'airKick') { lean = -0.18; kickExt = 1; }
          else if (ent.attackKey === 'uppercut') { lean = 0.1; upperExt = 1; }
          else if (ent.attackKey === 'airSlam') { lean = 0.4; kickExt = 0.9; }
        } else if (ent.state === 'hurt') lean = -0.35;
      } else {
        if (ent.state === 'windup') lean = -0.28;
        else if (ent.state === 'strike') { lean = 0.3; punchExt = 1.15; }
        else if (ent.state === 'hurt') lean = -0.38;
        else if (ent.state === 'stunned') lean = Math.sin(ent.animTime * 16) * 0.14;
      }

      ctx.rotate(lean);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';

      // Legs
      ctx.strokeStyle = bodyCol;
      ctx.lineWidth = ent.isBoss ? 12 : ent.isHeavy ? 9 : 6.5;
      ctx.beginPath(); ctx.moveTo(-4, -h * 0.38); ctx.lineTo(-10 - runCycle * 11, -3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4, -h * 0.38);
      if (kickExt > 0) ctx.lineTo(36 * kickExt, -34);
      else ctx.lineTo(10 + runCycle * 11, -3);
      ctx.stroke();

      // Torso
      ctx.fillStyle = bodyCol;
      const torsoW = ent.isBoss ? 38 : ent.isHeavy ? 26 : 18;
      ctx.beginPath(); ctx.roundRect(-torsoW / 2, -h + 16, torsoW, h * 0.5, 7); ctx.fill();

      // Boss / Heavy Armor Pads
      if (!isPlayer && (ent.isHeavy || ent.isBoss) && !overrideColor) {
        ctx.fillStyle = flashing ? '#ffffff' : (ent.isBoss ? '#facc15' : '#ef4444');
        ctx.beginPath(); ctx.roundRect(-torsoW * 0.72, -h + 15, torsoW * 1.44, ent.isBoss ? 15 : 11, 5); ctx.fill();
      }

      // Head
      ctx.fillStyle = bodyCol;
      ctx.beginPath(); ctx.arc(1, -h + 9, ent.isBoss ? 14.5 : ent.isHeavy ? 11.5 : 9.5, 0, Math.PI * 2); ctx.fill();

      // Visor / Headband / Boss Horns
      if (!overrideColor) {
        ctx.fillStyle = isPlayer ? pal.playerBand : (ent.state === 'windup' ? '#ef4444' : '#facc15');
        ctx.fillRect(-7, -h + 5, ent.isBoss ? 22 : 16, 4);
        if (ent.isBoss) {
          ctx.fillStyle = '#facc15';
          ctx.beginPath(); ctx.moveTo(-4, -h - 3); ctx.lineTo(-12, -h - 17); ctx.lineTo(4, -h - 6); ctx.fill();
          ctx.beginPath(); ctx.moveTo(6, -h - 3); ctx.lineTo(15, -h - 17); ctx.lineTo(12, -h - 4); ctx.fill();
        }
      }

      // Arm & Fist
      ctx.strokeStyle = bodyCol;
      ctx.lineWidth = ent.isBoss ? 11 : ent.isHeavy ? 8.5 : 6;
      ctx.beginPath(); ctx.moveTo(4, -h + 25);
      if (upperExt > 0) ctx.lineTo(16, -h - 16);
      else if (punchExt > 0) ctx.lineTo((ent.isBoss ? 44 : 34) * punchExt, -h + 25);
      else if (ent.state === 'charge') ctx.lineTo(-12, -h + 28);
      else if (ent.state === 'parry') ctx.lineTo(16, -h + 18);
      else ctx.lineTo(15, -h + 32);
      ctx.stroke();

      if (!overrideColor) {
        let fx = 15, fy = -h + 32, fr = ent.isBoss ? 9 : 4.8;
        if (upperExt > 0) { fx = 16; fy = -h - 17; fr = 7; }
        else if (punchExt > 0) { fx = (ent.isBoss ? 46 : 36) * punchExt; fy = -h + 25; fr = ent.isBoss ? 11 : punchExt > 1.2 ? 9.5 : 6.5; }
        else if (ent.state === 'charge') { fx = -13; fy = -h + 28; fr = kHoldTime >= 0.33 ? 8.5 : 6; }
        ctx.fillStyle = ent.state === 'charge' && kHoldTime >= 0.33 ? '#facc15' : accentCol;
        ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
      }

      // Player Active Parry Golden Shield Arc
      if (isPlayer && !overrideColor && ent.state === 'parry') {
        ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(10, -34, 26, -1.1, 1.1); ctx.stroke();
      }

      // Enemy Windup Warning
      if (!isPlayer && !overrideColor && ent.state === 'windup') {
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
        const pulse = 11 + Math.sin(ent.animTime * 45) * 4.5;
        ctx.beginPath(); ctx.arc(16, -h + 24, pulse, 0, Math.PI * 2); ctx.stroke();
      }

      // Boss / Buffer / Phase 2 Special Visuals
      if (!isPlayer && !overrideColor) {
        if (ent.type === 'buffer') {
          // Golden war-drum halo & aura on floor
          const pulse = 1 + Math.sin(ent.animTime * 6) * 0.14;
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.ellipse(0, 0, 32 * pulse, 9 * pulse, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
          // War Drum Staff
          ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(12, -10); ctx.lineTo(14, -h - 8); ctx.stroke();
          ctx.fillStyle = ent.state === 'windup' ? '#fef08a' : '#f59e0b';
          ctx.beginPath(); ctx.arc(14, -h - 10, ent.state === 'windup' ? 9 : 6.5, 0, Math.PI * 2); ctx.fill();
        }
        if (ent.type === 'boss_ninja') {
          // Glowing crimson-violet katana blade
          ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.moveTo(12, -h + 26); ctx.lineTo(44, -h + 6); ctx.stroke();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();
        }
        if (ent.type === 'boss_mage') {
          // Orbiting lightning plasma spheres + levitation ring
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.ellipse(0, 4, 24, 6, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
          for (let k = 0; k < 3; k++) {
            const ang = ent.animTime * 4.5 + k * 2.09;
            const ox = Math.cos(ang) * 28, oy = -h * 0.55 + Math.sin(ang) * 14;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(ox, oy, 5.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(ox, oy, 2.5, 0, Math.PI * 2); ctx.fill();
          }
        }
        if (ent.type === 'boss_fortress') {
          // Shoulder cannon & glowing overheat core when shield is down
          ctx.fillStyle = '#475569';
          ctx.fillRect(-20, -h + 2, 26, 12);
          ctx.fillStyle = ent.hasShield ? '#38bdf8' : '#ef4444';
          ctx.beginPath(); ctx.arc(0, -h + 38, ent.hasShield ? 6 : 10, 0, Math.PI * 2); ctx.fill();
        }
        if (ent.type === 'boss_twin_fire') {
          ctx.fillStyle = '#facc15';
          ctx.beginPath(); ctx.arc(16, -h + 30, 7.5, 0, Math.PI * 2); ctx.fill();
        }
        if (ent.type === 'boss_twin_ice') {
          ctx.strokeStyle = '#67e8f9'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-18, -h + 20); ctx.lineTo(-26, -h + 6); ctx.lineTo(-12, -h + 12); ctx.closePath(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(18, -h + 16); ctx.lineTo(28, -h + 4); ctx.lineTo(14, -h + 24); ctx.closePath(); ctx.stroke();
        }
        if (ent.isBoss && ent.phase >= 2) {
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.65;
          ctx.beginPath(); ctx.ellipse(0, -h * 0.45, 28 + Math.sin(ent.animTime * 16) * 4, h * 0.56, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // Enemy Shield
      if (!isPlayer && !overrideColor && ent.hasShield) {
        ctx.fillStyle = pal.shieldFill; ctx.strokeStyle = pal.shieldStroke; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(14, -h + 10, 10, h - 16, 4); ctx.fill(); ctx.stroke();
      }

      ctx.restore();

      // Player Headband tail
      if (isPlayer && !overrideColor) {
        ctx.save(); ctx.strokeStyle = pal.playerBand; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(ent.bandPoints[0].x, ent.bandPoints[0].y);
        for (let i = 1; i < ent.bandPoints.length; i++) ctx.lineTo(ent.bandPoints[i].x, ent.bandPoints[i].y);
        ctx.stroke(); ctx.restore();
      }

      // Non-boss HP bar & Buff tag
      if (!isPlayer && !overrideColor && ent.state !== 'dead' && !ent.isBoss) {
        const bw = 42, bh = 5, bx = ent.x - bw / 2, by = ent.y - ent.h - 15;
        if (ent.type !== 'dummy') {
          ctx.fillStyle = pal.hpBg; ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = ent.state === 'stunned' ? '#facc15' : (ent.type === 'buffer' ? '#f59e0b' : '#ef4444');
          ctx.fillRect(bx, by, bw * (ent.hp / ent.maxHp), bh);
        } else {
          ctx.font = '600 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = pal.hudSub;
          ctx.fillText(ent.label, ent.x, by + 2);
        }
        if (ent.state === 'stunned') {
          ctx.font = '700 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#facc15';
          ctx.fillText('破防眩晕!', ent.x, by - 5);
        } else if (ent.type === 'buffer') {
          ctx.font = '800 10.5px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#facc15';
          ctx.fillText('★ 战巫(优先杀)', ent.x, by - 5);
        } else if (ent.buffTimer > 0) {
          ctx.font = '800 10.5px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#ef4444';
          ctx.fillText('▲ 狂暴', ent.x, by - 5);
        }
      }
    }

    function drawPropsAndPickups(pal) {
      for (const p of props) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.scaleX, p.scaleY);
        if (p.kind === 'barrel') {
          ctx.fillStyle = p.flashTimer > 0 ? '#ffffff' : '#dc2626';
          ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(-15, -42, 30, 42, 5); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#facc15'; ctx.fillRect(-14, -28, 28, 6);
          ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fef08a';
          ctx.fillText('爆', 0, -10);
        } else {
          ctx.fillStyle = p.flashTimer > 0 ? '#ffffff' : '#b45309';
          ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(-16, -34, 32, 34, 3); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-14, -32); ctx.lineTo(14, -2); ctx.moveTo(14, -32); ctx.lineTo(-14, -2); ctx.stroke();
        }
        ctx.restore();
      }

      for (const pk of pickups) {
        const bob = Math.sin(pk.anim * 7) * 4;
        ctx.save();
        ctx.translate(pk.x, pk.y - 14 + bob);
        ctx.fillStyle = pk.kind === 'heal' ? '#22c55e' : '#facc15';
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
        ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#0f172a';
        ctx.fillText(pk.kind === 'heal' ? '+' : '气', 0, 4);
        ctx.restore();
      }

      // Projectiles (Shuriken, Plasma Orbs, Ice Spears, Mortar Bombs)
      for (const pr of projectiles) {
        ctx.save();
        ctx.translate(pr.x, pr.y);
        if (pr.kind === 'orb') {
          const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
          g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, pr.friendly ? '#facc15' : '#38bdf8'); g.addColorStop(1, 'rgba(56,189,248,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
        } else if (pr.kind === 'bomb') {
          ctx.fillStyle = '#dc2626'; ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (pr.kind === 'ice') {
          ctx.fillStyle = pr.friendly ? '#facc15' : '#67e8f9';
          const d = pr.vx >= 0 ? 1 : -1;
          ctx.beginPath(); ctx.moveTo(16 * d, 0); ctx.lineTo(-10 * d, -5); ctx.lineTo(-10 * d, 5); ctx.closePath(); ctx.fill();
        } else {
          ctx.rotate(pr.rot);
          ctx.fillStyle = pr.friendly ? '#38bdf8' : '#e879f9';
          for (let k = 0; k < 4; k++) {
            ctx.rotate(Math.PI / 2);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(13, -3); ctx.lineTo(4, 3); ctx.closePath(); ctx.fill();
          }
        }
        ctx.restore();
      }

      // Boss Ground Shockwaves
      for (const s of shockwaves) {
        ctx.save();
        ctx.fillStyle = '#ef4444'; ctx.globalAlpha = s.life / s.maxLife;
        ctx.beginPath();
        ctx.moveTo(s.x - 16, GROUND_Y); ctx.lineTo(s.x, GROUND_Y - 26); ctx.lineTo(s.x + 16, GROUND_Y);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      // Boss Hazards (Magma Pillars, Sky Lightning, Iai Line, Repulse Nova, Pulse Beam, Frost Zone)
      for (const h of hazards) {
        ctx.save();
        if (h.kind === 'slashLine') {
          const pulse = 0.55 + Math.sin(envTime * 45) * 0.4;
          ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 3.5; ctx.globalAlpha = pulse;
          ctx.setLineDash([12, 8]);
          ctx.beginPath(); ctx.moveTo(WALL_L, h.y); ctx.lineTo(WALL_R, h.y); ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(WALL_L, h.y); ctx.lineTo(WALL_R, h.y); ctx.stroke();
        } else if (h.kind === 'pillar' || h.kind === 'lightningStrike') {
          const isLt = h.kind === 'lightningStrike';
          if (h.timer > 0) {
            const p = 1 - h.timer / h.maxTimer;
            ctx.strokeStyle = isLt ? '#38bdf8' : '#ef4444'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.ellipse(h.x, GROUND_Y + 2, 32, 9, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = isLt ? `rgba(56,189,248,${0.18 + p * 0.45})` : `rgba(239,68,68,${0.18 + p * 0.45})`;
            ctx.beginPath(); ctx.ellipse(h.x, GROUND_Y + 2, 32 * p, 9 * p, 0, 0, Math.PI * 2); ctx.fill();
          } else {
            const a = h.activeTimer / (isLt ? 0.24 : 0.26);
            ctx.globalAlpha = a;
            if (isLt) {
              ctx.fillStyle = '#38bdf8'; ctx.fillRect(h.x - 16 * a, 0, 32 * a, GROUND_Y);
              ctx.fillStyle = '#ffffff'; ctx.fillRect(h.x - 6 * a, 0, 12 * a, GROUND_Y);
            } else {
              const g = ctx.createLinearGradient(h.x, GROUND_Y - 125, h.x, GROUND_Y);
              g.addColorStop(0, '#fef08a'); g.addColorStop(0.5, '#f97316'); g.addColorStop(1, '#dc2626');
              ctx.fillStyle = g;
              ctx.beginPath(); ctx.roundRect(h.x - 24 * a, GROUND_Y - 125, 48 * a, 128, 12); ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.beginPath(); ctx.roundRect(h.x - 9 * a, GROUND_Y - 115, 18 * a, 115, 6); ctx.fill();
            }
          }
        } else if (h.kind === 'nova') {
          const a = h.life / h.maxLife;
          ctx.globalAlpha = a;
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 8 * a;
          ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
        } else if (h.kind === 'beam') {
          const a = h.life / h.maxLife;
          const x1 = h.x, x2 = h.dir === 1 ? WALL_R : WALL_L;
          ctx.globalAlpha = a;
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(Math.min(x1, x2), h.y - 16 * a, Math.abs(x2 - x1), 32 * a);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(Math.min(x1, x2), h.y - 6 * a, Math.abs(x2 - x1), 12 * a);
        } else if (h.kind === 'frost') {
          const a = Math.min(1, h.life / 1.2);
          ctx.globalAlpha = a * 0.55;
          ctx.fillStyle = '#22d3ee';
          ctx.beginPath(); ctx.ellipse(h.x, GROUND_Y + 4, h.r, 14, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#cffafe'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawHUDInCanvas(pal) {
      ctx.save();
      // Player HP Bar
      ctx.fillStyle = pal.hudSub; ctx.font = '700 11px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('HP', 16, 20);
      ctx.fillStyle = pal.hpBg; ctx.beginPath(); ctx.roundRect(38, 11, 146, 9, 4); ctx.fill();
      ctx.fillStyle = player.hp > player.maxHp * 0.3 ? '#22c55e' : '#ef4444';
      ctx.beginPath(); ctx.roundRect(38, 11, 146 * (player.hp / player.maxHp), 9, 4); ctx.fill();

      // Player SP (Stamina) Bar
      ctx.fillStyle = pal.hudSub; ctx.fillText('SP', 16, 34);
      ctx.fillStyle = pal.hpBg; ctx.beginPath(); ctx.roundRect(38, 25, 146, 8, 4); ctx.fill();
      const spLow = player.exhaustedTimer > 0 || player.sp < player.maxSp * 0.25;
      ctx.fillStyle = player.exhaustedTimer > 0
        ? (Math.floor(performance.now() / 110) % 2 ? '#ef4444' : '#fca5a5')
        : (spLow ? '#f59e0b' : '#10b981');
      ctx.beginPath(); ctx.roundRect(38, 25, 146 * (player.sp / player.maxSp), 8, 4); ctx.fill();
      if (player.exhaustedTimer > 0) {
        ctx.font = '800 10.5px sans-serif'; ctx.fillStyle = '#ef4444';
        ctx.fillText('力竭喘息!', 190, 33);
      }

      // Player EX Super Bar
      ctx.fillStyle = pal.hudSub; ctx.font = '700 11px sans-serif'; ctx.fillText('EX', 16, 48);
      ctx.fillStyle = pal.hpBg; ctx.beginPath(); ctx.roundRect(38, 39, 146, 8, 4); ctx.fill();
      const exFull = player.ex >= player.maxEx;
      ctx.fillStyle = exFull ? (Math.floor(performance.now() / 120) % 2 ? '#facc15' : '#f97316') : '#38bdf8';
      ctx.beginPath(); ctx.roundRect(38, 39, 146 * (player.ex / player.maxEx), 8, 4); ctx.fill();
      if (exFull) {
        ctx.font = '800 11px sans-serif'; ctx.fillStyle = '#facc15';
        ctx.fillText('按 U 放必杀!', 190, 47);
      }

      // Boss Bar(s) — Automatically supports Single Boss or Side-by-Side Twin Bosses!
      const bosses = enemies.filter(e => e.isBoss && e.state !== 'dead');
      if (bosses.length === 1) {
        const boss = bosses[0];
        const bw = 340, bx = (W - bw) / 2;
        ctx.textAlign = 'center'; ctx.font = '800 12px sans-serif';
        ctx.fillStyle = boss.phase >= 2 ? '#facc15' : '#ef4444';
        ctx.fillText(boss.phase >= 2 ? `${boss.label}  [二阶段觉醒]` : boss.label, W / 2, 20);
        ctx.fillStyle = pal.hpBg; ctx.beginPath(); ctx.roundRect(bx, 25, bw, 11, 5); ctx.fill();
        ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.roundRect(bx, 25, bw * (boss.hp / boss.maxHp), 11, 5); ctx.fill();
        ctx.fillStyle = pal.hpBg; ctx.beginPath(); ctx.roundRect(bx + 30, 39, bw - 60, 5, 3); ctx.fill();
        ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.roundRect(bx + 30, 39, (bw - 60) * (boss.posture / boss.maxPosture), 5, 3); ctx.fill();
      } else if (bosses.length >= 2) {
        bosses.slice(0, 2).forEach((boss, idx) => {
          const bw = 200, gap = 16;
          const bx = W / 2 - bw - gap / 2 + idx * (bw + gap);
          ctx.textAlign = 'center'; ctx.font = '800 11px sans-serif';
          ctx.fillStyle = boss.type === 'boss_twin_fire' ? '#fb923c' : '#22d3ee';
          ctx.fillText(boss.label, bx + bw / 2, 19);
          ctx.fillStyle = pal.hpBg; ctx.beginPath(); ctx.roundRect(bx, 24, bw, 10, 4); ctx.fill();
          ctx.fillStyle = boss.type === 'boss_twin_fire' ? '#f97316' : '#06b6d4';
          ctx.beginPath(); ctx.roundRect(bx, 24, bw * (boss.hp / boss.maxHp), 10, 4); ctx.fill();
          ctx.fillStyle = pal.hpBg; ctx.beginPath(); ctx.roundRect(bx + 14, 37, bw - 28, 4, 2); ctx.fill();
          ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.roundRect(bx + 14, 37, (bw - 28) * (boss.posture / boss.maxPosture), 4, 2); ctx.fill();
        });
      }

      // Charge Gauge over player
      if (kHolding && kHoldTime > 0.08) {
        const pct = Math.min(1, kHoldTime / 0.33);
        ctx.fillStyle = pal.hpBg; ctx.fillRect(player.x - 24, player.y - 84, 48, 6);
        ctx.fillStyle = pct >= 1 ? '#facc15' : '#fb923c'; ctx.fillRect(player.x - 24, player.y - 84, 48 * pct, 6);
      }

      // Combo Counter
      if (comboCount > 0) {
        const rank = comboCount >= 20 ? 'SSS' : comboCount >= 14 ? 'SS' : comboCount >= 9 ? 'S' : comboCount >= 6 ? 'A' : comboCount >= 3 ? 'B' : 'C';
        const rankCol = comboCount >= 14 ? '#facc15' : comboCount >= 6 ? '#fb923c' : '#38bdf8';
        ctx.save(); ctx.translate(W - 22, 48); ctx.scale(comboScale, comboScale);
        ctx.textAlign = 'right'; ctx.font = '900 30px sans-serif'; ctx.fillStyle = rankCol;
        ctx.fillText(`${comboCount} HIT`, 0, 0);
        ctx.font = '800 13px sans-serif'; ctx.fillStyle = pal.hudText;
        ctx.fillText(`RANK ${rank}`, 0, 18); ctx.restore();
      }

      // Speed Lines
      if (speedLineAlpha > 0.02 && feel.shake) {
        ctx.save(); ctx.globalAlpha = speedLineAlpha; ctx.strokeStyle = pal.speedLine; ctx.lineWidth = 2;
        for (let i = 0; i < 18; i++) {
          const ang = (i / 18) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(W / 2 + Math.cos(ang) * 280, H / 2 + Math.sin(ang) * 140);
          ctx.lineTo(W / 2 + Math.cos(ang) * 530, H / 2 + Math.sin(ang) * 265);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Banner
      if (bannerTimer > 0 && upgradeChoices.length === 0 && !gameOver) {
        ctx.save(); ctx.globalAlpha = Math.min(1, bannerTimer * 1.8); ctx.textAlign = 'center';
        ctx.font = '900 23px sans-serif'; ctx.fillStyle = pal.hudText; ctx.fillText(bannerText, W / 2, 84);
        if (bannerSub) { ctx.font = '600 12px sans-serif'; ctx.fillStyle = pal.hudSub; ctx.fillText(bannerSub, W / 2, 104); }
        ctx.restore();
      }

      // Roguelike 3-Choice Upgrade Cards + Wave Score Breakdown Overlay
      if (upgradeChoices.length > 0) {
        ctx.fillStyle = 'rgba(7, 10, 18, 0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.font = '900 20px sans-serif'; ctx.fillStyle = '#facc15';
        ctx.fillText(`WAVE ${wave} 清场结算！选择一项强化（点击卡片或按 1 / 2 / 3）`, W / 2, 36);

        if (runStats.waveBonus) {
          const wb = runStats.waveBonus;
          ctx.font = '600 12px monospace'; ctx.fillStyle = '#cbd5e1';
          const parts = [`清场 +${wb.clearBonus}`, `血量 +${wb.hpBonus}`];
          if (wb.noHitBonus > 0) parts.push(`无伤完美 +${wb.noHitBonus}`);
          if (wb.comboBonus > 0) parts.push(`最高连击 +${wb.comboBonus}`);
          parts.push(`本波共计 +${wb.totalAdd} 分`);
          ctx.fillText(parts.join('  ·  '), W / 2, 60);
        }

        const cw = 248, ch = 186, gap = 26, startX = (W - (cw * 3 + gap * 2)) / 2, y = 84;
        upgradeChoices.forEach((u, idx) => {
          const x = startX + idx * (cw + gap);
          const hov = hoveredCard === idx;
          ctx.save();
          ctx.fillStyle = hov ? '#1e293b' : '#0f172a';
          ctx.strokeStyle = hov ? '#facc15' : u.color;
          ctx.lineWidth = hov ? 3.5 : 2;
          ctx.beginPath(); ctx.roundRect(x, y - (hov ? 6 : 0), cw, ch, 12); ctx.fill(); ctx.stroke();

          ctx.font = '700 12px monospace'; ctx.fillStyle = '#94a3b8';
          ctx.fillText(`按 [${idx + 1}] 选择`, x + cw / 2, y + 24 - (hov ? 6 : 0));
          ctx.font = '32px sans-serif';
          ctx.fillText(u.icon, x + cw / 2, y + 70 - (hov ? 6 : 0));
          ctx.font = '800 17px sans-serif'; ctx.fillStyle = '#f8fafc';
          ctx.fillText(u.name, x + cw / 2, y + 102 - (hov ? 6 : 0));

          ctx.font = '500 12.5px sans-serif'; ctx.fillStyle = '#cbd5e1';
          const mid = Math.ceil(u.desc.length / 2);
          ctx.fillText(u.desc.slice(0, mid), x + cw / 2, y + 134 - (hov ? 6 : 0));
          ctx.fillText(u.desc.slice(mid), x + cw / 2, y + 154 - (hov ? 6 : 0));
          ctx.restore();
        });
      }

      // Game Over Arcade Settlement Screen
      if (gameOver && settlement) {
        const s = settlement;
        ctx.fillStyle = 'rgba(6, 9, 16, 0.84)';
        ctx.fillRect(0, 0, W, H);

        const px = 140, py = 26, pw = W - 280, ph = H - 52;
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#fb923c';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 14); ctx.fill(); ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = '900 22px sans-serif'; ctx.fillStyle = '#f8fafc';
        ctx.fillText('战斗结算 · BATTLE RESULT', px + 28, py + 38);

        if (s.isNewRecord) {
          ctx.fillStyle = '#facc15';
          ctx.font = '800 12px monospace';
          ctx.fillText('★ NEW HIGH SCORE!', px + 300, py + 36);
        }

        // Breakdown rows
        const rows = [
          [`基础战斗分`, `${s.combatScore}`],
          [`抵达波次 (WAVE ${s.wave})`, `+${s.waveBonus}`],
          [`击杀敌人 (${s.kills} 名)`, `+${s.killBonus}`],
          [`最高连击 (${s.maxCombo} HIT)`, `+${s.comboBonus}`],
          [`弹反 / 破盾技巧 (${s.techCount} 次)`, `+${s.techBonus}`],
        ];
        let ry = py + 74;
        rows.forEach(([label, val]) => {
          ctx.font = '500 13.5px sans-serif'; ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'left';
          ctx.fillText(label, px + 30, ry);
          ctx.font = '700 14px monospace'; ctx.fillStyle = '#e2e8f0'; ctx.textAlign = 'right';
          ctx.fillText(val, px + 390, ry);
          ry += 28;
        });

        // Divider & Total
        ctx.strokeStyle = 'rgba(148,163,184,0.28)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px + 28, ry - 8); ctx.lineTo(px + 392, ry - 8); ctx.stroke();
        ctx.font = '800 16px sans-serif'; ctx.fillStyle = '#facc15'; ctx.textAlign = 'left';
        ctx.fillText('最终总积分', px + 30, ry + 18);
        ctx.font = '900 24px monospace'; ctx.textAlign = 'right';
        ctx.fillText(`${s.totalScore}`, px + 390, ry + 20);

        // Giant Rank Stamp on right
        const rx = px + pw - 118, ryCenter = py + 132;
        ctx.save();
        ctx.translate(rx, ryCenter);
        ctx.rotate(-0.12);
        ctx.strokeStyle = s.rank.startsWith('S') ? '#facc15' : '#fb923c';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.stroke();
        ctx.textAlign = 'center';
        ctx.font = '700 11px monospace'; ctx.fillStyle = '#94a3b8';
        ctx.fillText('EVALUATION', 0, -24);
        ctx.font = '900 44px sans-serif'; ctx.fillStyle = s.rank.startsWith('S') ? '#facc15' : '#fb923c';
        ctx.fillText(s.rank, 0, 20);
        ctx.restore();

        // Retry button
        const bx = px + pw / 2 - 115, by = py + ph - 48, bw = 230, bh = 34;
        ctx.fillStyle = '#f97316';
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill();
        ctx.textAlign = 'center'; ctx.font = '800 14px sans-serif'; ctx.fillStyle = '#0f172a';
        ctx.fillText('点击或按 R / Enter 再来一局', W / 2, by + 22);
      }
      ctx.restore();
    }

    function render() {
      const biome = getBiome(wave);
      const pal = getPalette(biome);
      ctx.save();
      ctx.scale(canvas.width / W, canvas.height / H);

      ctx.save();
      ctx.translate(W / 2 + camShakeX, H / 2 + camShakeY);
      ctx.scale(camZoom, camZoom);
      ctx.translate(-W / 2, -H / 2);

      drawStage(pal, biome);
      drawPropsAndPickups(pal);

      for (const a of afterimages) drawFighter(a, true, pal, a.color, (a.life / a.maxLife) * 0.34);
      for (const e of enemies) drawFighter(e, false, pal, null, e.deadAlpha);
      drawFighter(player, true, pal);

      // Arcs
      for (const a of arcs) {
        const t = a.life / a.maxLife;
        ctx.save(); ctx.translate(a.x, a.y); ctx.scale(a.dir, 1); ctx.globalAlpha = t * 0.92;
        ctx.strokeStyle = a.color; ctx.fillStyle = a.color;
        if (a.arcType === 'thrust' || a.arcType === 'mega') {
          const len = a.arcType === 'mega' ? 92 : 46, th = a.arcType === 'mega' ? 19 * t : 8 * t;
          ctx.beginPath(); ctx.moveTo(-10, -th); ctx.lineTo(len, 0); ctx.lineTo(-10, th); ctx.closePath(); ctx.fill();
        } else if (a.arcType === 'upper') {
          ctx.lineWidth = 10 * t; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(-8, 4, 48, 0.35, -1.55, true); ctx.stroke();
        } else {
          ctx.lineWidth = (a.arcType === 'kick' ? 12 : 8) * t; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(-10, 0, a.arcType === 'kick' ? 54 : 40, -0.9, 0.95); ctx.stroke();
        }
        ctx.restore();
      }

      // Lightnings
      for (const l of lightnings) {
        ctx.save(); ctx.globalAlpha = l.life / l.maxLife;
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(l.pts[0].x, l.pts[0].y);
        for (let i = 1; i < l.pts.length; i++) ctx.lineTo(l.pts[i].x, l.pts[i].y);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6; ctx.stroke();
        ctx.restore();
      }

      // Rings
      for (const r of rings) {
        const t = r.life / r.maxLife;
        ctx.save(); ctx.globalAlpha = t; ctx.strokeStyle = r.color; ctx.lineWidth = r.lineWidth * t;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      }

      // Particles
      for (const p of particles) {
        const t = p.life / p.maxLife;
        ctx.save(); ctx.globalAlpha = Math.min(1, t * 1.4); ctx.fillStyle = p.color;
        if (p.kind === 'spark') {
          ctx.strokeStyle = p.color; ctx.lineWidth = p.size * 0.7; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.028, p.y - p.vy * 0.028); ctx.stroke();
        } else if (p.kind === 'shard') {
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.beginPath(); ctx.moveTo(-p.size, -p.size * 0.5); ctx.lineTo(p.size, 0); ctx.lineTo(-p.size * 0.3, p.size * 0.8); ctx.closePath(); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.2 - t * 0.4), 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }

      // Floating Texts
      for (const f of floatTexts) {
        const t = f.life / f.maxLife;
        ctx.save(); ctx.globalAlpha = Math.min(1, t * 1.8);
        ctx.font = `900 ${Math.round(16 * f.scale)}px sans-serif`; ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 3.5; ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); ctx.restore();
      }

      ctx.restore();
      drawForegroundAtmosphere(pal, biome);
      drawHUDInCanvas(pal);
      ctx.restore();
    }

    // ==================== Input & Canvas Card Picking ====================
    function canvasLogicalPos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    }

    function cardIndexAt(px, py) {
      if (upgradeChoices.length === 0) return -1;
      const cw = 248, ch = 186, gap = 26, startX = (W - (cw * 3 + gap * 2)) / 2, y = 86;
      for (let i = 0; i < 3; i++) {
        const x = startX + i * (cw + gap);
        if (px >= x && px <= x + cw && py >= y - 6 && py <= y + ch) return i;
      }
      return -1;
    }

    function startAndFocus() {
      initAudio();
      if (!started) {
        started = true;
        startOverlay.style.opacity = '0';
        setTimeout(() => startOverlay.classList.add('hidden'), 200);
      }
      canvas.focus();
      focusHint.classList.add('hidden');
    }

    startOverlay.addEventListener('pointerdown', startAndFocus);
    canvas.addEventListener('pointermove', (e) => {
      if (upgradeChoices.length === 0) return;
      const pos = canvasLogicalPos(e);
      hoveredCard = cardIndexAt(pos.x, pos.y);
      canvas.style.cursor = hoveredCard >= 0 ? 'pointer' : 'crosshair';
    });
    canvas.addEventListener('pointerdown', (e) => {
      startAndFocus();
      if (gameOver) {
        hudBest.textContent = `BEST ${bestScore}`; document.getElementById("btn-theme").addEventListener("click", () => { document.documentElement.classList.toggle("light"); window.dispatchEvent(new Event("themechange")); }); resetGame(false);
        return;
      }
      if (upgradeChoices.length > 0) {
        const pos = canvasLogicalPos(e);
        const idx = cardIndexAt(pos.x, pos.y);
        if (idx >= 0) { selectUpgrade(idx); canvas.style.cursor = 'crosshair'; }
      }
    });
    canvas.addEventListener('blur', () => { if (started) focusHint.classList.remove('hidden'); });
    canvas.addEventListener('focus', () => focusHint.classList.add('hidden'));

    function pressJ() { initAudio(); if (canActNow()) triggerLightAttack(); else inputBuffer = { type: 'J', time: performance.now() }; }
    function downK() {
      initAudio();
      if (!player.onGround) { if (canActNow()) startAttack('airSlam'); else inputBuffer = { type: 'K_TAP', time: performance.now() }; return; }
      if (!kHolding) { kHolding = true; kHoldTime = 0; kChargeNotified = false; }
    }
    function upK() {
      if (!kHolding) return;
      const held = kHoldTime; kHolding = false; kHoldTime = 0; kChargeNotified = false;
      if (player.state === 'charge') player.state = 'idle';
      if (held >= 0.32 && player.onGround) startAttack('chargePunch');
      else { if (canActNow()) startAttack(player.onGround ? 'uppercut' : 'airSlam'); else inputBuffer = { type: 'K_TAP', time: performance.now() }; }
    }
    function pressJump() {
      initAudio();
      if (player.state === 'hurt' || player.state === 'dash' || player.state === 'super') return;
      if (player.onGround || player.airJumps > 0) {
        if (!player.onGround) player.airJumps--;
        player.vy = -595; player.onGround = false;
        if (player.state === 'charge') { kHolding = false; player.state = 'idle'; }
        applySquash(player, 0.78, 1.28); addDust(player.x, player.y, 6, 0); sfx.whoosh(1.3);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (!started) return;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (gameOver) {
        if (e.code === 'KeyR' || e.code === 'Enter' || e.code === 'Space') resetGame(false);
        return;
      }
      if (upgradeChoices.length > 0) {
        if (e.code === 'Digit1') selectUpgrade(0);
        else if (e.code === 'Digit2') selectUpgrade(1);
        else if (e.code === 'Digit3') selectUpgrade(2);
        return;
      }
      if (keys[e.code]) return;
      keys[e.code] = true;
      if (e.code === 'KeyW' || e.code === 'Space' || e.code === 'ArrowUp') pressJump();
      else if (e.code === 'KeyJ') pressJ();
      else if (e.code === 'KeyK') downK();
      else if (e.code === 'KeyL' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { initAudio(); triggerDash(); }
      else if (e.code === 'KeyI') { initAudio(); if (canActNow()) triggerParry(); else inputBuffer = { type: 'I', time: performance.now() }; }
      else if (e.code === 'KeyU') { initAudio(); triggerSuper(); }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; if (e.code === 'KeyK') upK(); });

    // Action buttons
    document.getElementById('act-j').addEventListener('pointerdown', (e) => { e.preventDefault(); startAndFocus(); pressJ(); });
    const actK = document.getElementById('act-k');
    actK.addEventListener('pointerdown', (e) => { e.preventDefault(); startAndFocus(); downK(); });
    actK.addEventListener('pointerup', upK);
    actK.addEventListener('pointerleave', () => { if (kHolding) upK(); });
    document.getElementById('act-i').addEventListener('pointerdown', (e) => { e.preventDefault(); startAndFocus(); triggerParry(); });
    document.getElementById('act-u').addEventListener('pointerdown', (e) => { e.preventDefault(); startAndFocus(); triggerSuper(); });

    btnMode.addEventListener('click', () => {
      mode = mode === 'waves' ? 'dummy' : 'waves';
      btnMode.textContent = mode === 'waves' ? '木桩训练' : '闯关模式';
      resetGame(false); startAndFocus();
    });
    btnBiome.addEventListener('click', () => {
      const cur = getBiome(wave);
      forcedBiome = (cur + 1) % 3;
      hudWave.textContent = mode === 'dummy'
        ? `木桩训练 · ${BIOME_NAMES[forcedBiome]}`
        : `WAVE ${wave} · ${BIOME_NAMES[forcedBiome]}`;
      showBanner(`场景切换 · ${BIOME_NAMES[forcedBiome]}`, '支持 2.5D 视差景深与地面战痕交互');
      startAndFocus();
    });
    bossSelect.addEventListener('change', () => {
      const val = Number(bossSelect.value);
      if (!val) return;
      forcedBiome = -1;
      resetGame(val);
      bossSelect.value = '';
      startAndFocus();
    });
    btnReset.addEventListener('click', () => { forcedBiome = -1; resetGame(0); startAndFocus(); });

    document.querySelectorAll('.toggle-pill').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.feel;
        feel[key] = !feel[key];
        btn.dataset.on = String(feel[key]);
        if (started) canvas.focus();
      });
    });

    resetGame(false);
    if (document.documentElement.classList.contains('in-station')) {
      window.addEventListener('blur', () => {
        for (const code of Object.keys(keys)) keys[code] = false;
        kHolding = false;
        kHoldTime = 0;
        kChargeNotified = false;
        if (player.state === 'charge') player.state = 'idle';
      });
      startAndFocus();
      parent.postMessage({type:'cartridge-ready', id:'iron-impact'}, location.origin);
    }
    let lastTs = performance.now();
    function loop(ts) {
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
