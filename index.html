<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="卡嗒的独立游戏卡带架。选一张卡带，按手柄 START，在电视里试玩。">
  <title>怪兽仙境 · 卡嗒</title>
  <link rel="icon" href="icons/controller.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hardware.css?v=20261124.5">
  <link rel="stylesheet" href="gallery.css">
  <link rel="stylesheet" href="trial-case.css?v=20261124.3">
  <link rel="preload" as="image" href="hardware/cart/front.webp">
  <link rel="preload" as="image" href="hardware/trial/dock.webp">
  <script type="module" src="app.js?v=20261124.5"></script>
</head>
<body>
  <a href="#games" class="skip">跳到作品</a>
  <header class="top">
    <a class="brand press" href="#games"><span id="studio">卡嗒</span></a>
    <nav aria-label="主导航"><a class="selected press" href="#games">作品</a><a class="nav-btn press" href="#trial">试玩台</a><button class="nav-btn press" id="about-open">关于</button></nav>
  </header>
  <main id="games">
    <section data-catalog class="shelf" aria-labelledby="game-name">
      <div class="rack assembly" role="group" aria-label="游戏卡带切换架">
        <img class="chassis" src="hardware/rack/rack.png" alt="">
        <button class="hardware-key rack-key" data-mode="game" aria-label="选择怪兽仙境" aria-pressed="true"><span class="keycap"><img src="hardware/rack/key-1.png" alt=""><span class="rack-title">怪兽仙境</span></span></button>
        <button class="hardware-key rack-key" data-mode="slot-2" aria-label="空卡槽" disabled><span class="keycap"><img src="hardware/rack/key-2.png" alt=""><span class="rack-title"></span></span></button>
        <button class="hardware-key rack-key" data-mode="slot-3" aria-label="空卡槽" disabled><span class="keycap"><img src="hardware/rack/key-3.png" alt=""><span class="rack-title"></span></span></button>
        <button class="hardware-key rack-key" data-mode="slot-4" aria-label="空卡槽" disabled><span class="keycap"><img src="hardware/rack/key-4.png" alt=""><span class="rack-title"></span></span></button>
        <button class="hardware-key rack-key" data-mode="slot-5" aria-label="空卡槽" disabled><span class="keycap"><img src="hardware/rack/key-5.png" alt=""><span class="rack-title"></span></span></button>
      </div>
      <div class="cart-stage" role="group" aria-label="立体游戏卡带">
        <div class="cast-shadow" aria-hidden="true"></div>
        <div class="cart-space"><div class="cart-body">
          <div class="cart-side side-left"></div><div class="cart-side side-right"></div><div class="cart-side side-top"></div><div class="cart-side side-bottom"></div>
          <div class="cart-face cart-back"></div>
          <div class="cart-face cart-front"><img src="hardware/cart/front.webp" alt="" draggable="false" fetchpriority="high"><span class="trial-sticker"><img id="sticker-print" src="media/demo/monster-paradise-start.webp" alt="怪兽仙境 Demo 开场画面卡贴" draggable="false"></span></div>
        </div></div>
        <button class="cart-touch" id="grab-cart" aria-label="旋转怪兽仙境卡带" aria-describedby="cart-guide" title="拖动旋转 · 双击复位"></button>
        <span id="cart-guide" class="sr">拖动可以转动和移动卡带，松手后会依惯性回落。也可使用方向键旋转，按空格翻面，按 Home 复位。</span>
        <div class="cart-tools"><button id="flip-cart">翻面</button><span aria-hidden="true">/</span><button id="cover-button">看封面</button><span aria-hidden="true">/</span><button id="sound-toggle" aria-pressed="true">键音开</button></div>
      </div>
      <div class="game-details">
        <h2 id="game-name">怪兽仙境</h2>
        <div class="divider" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="game-note">
          <div class="game-actions">
            <button type="button" id="online-play" class="launch-key" aria-controls="layer-play"><span class="launch-cap"><img src="icons/play-fill.svg" alt="">在线试玩</span></button>
            <span id="tag" class="edition-note">开发中 Demo</span>
          </div>
          <div class="note-copy">
            <p id="description">从序章开始，跟随奥尼克听耐法瑞讲起往事。</p>
            <output id="platform-status" aria-live="polite"></output>
          </div>
        </div>
        <div id="download" class="deck assembly" role="group" aria-label="游戏下载">
          <img class="chassis" src="hardware/deck/base.png" alt="">
          <button id="windows" class="hardware-key deck-key" data-platform="Windows" aria-label="Windows 版，查看发布状态"><span class="keycap"><img src="hardware/deck/windows-blank.png" alt=""><span class="legend">Windows · <span class="availability">待发布</span></span></span></button>
          <button id="android" class="hardware-key deck-key" data-platform="Android" aria-label="Android 版，查看发布状态"><span class="keycap"><img src="hardware/deck/android-blank.png" alt=""><span class="legend">Android · <span class="availability">待发布</span></span></span></button>
        </div>
      </div>
    </section>
    <section class="trial-section" id="trial" aria-labelledby="trial-heading">
      <div class="dock-layout">
        <aside class="dock-rail">
          <h2 class="dock-title" id="trial-heading" aria-label="试玩台"><span>试</span><span>玩</span><span>台</span></h2>
          <div class="dock-lime-bar" aria-hidden="true"></div>
          <strong id="expanded-title"></strong>
          <button type="button" id="screen-size" aria-controls="trial-viewport" aria-expanded="false"><span class="size-mark" aria-hidden="true"></span><span id="size-label">放大试玩</span></button>
        </aside>

        <div class="dock-stage">
          <img class="dock-chassis" src="hardware/trial/dock.webp" alt="一体式掌机试玩底座与实体手柄" draggable="false">

          <div class="screen-viewport" id="trial-viewport">
            <div class="screen-layer" id="layer-play">
              <button type="button" id="tv-power" class="tv-power">
                <img id="standby-art" alt=""><span class="standby-copy"><strong id="standby-title"></strong><small id="standby-hint">按 START 试玩开发中 Demo</small></span>
              </button>
            </div>
          </div>
          <div class="pad-controls" role="group" aria-label="试玩手柄">
            <div class="pad-dpad-zone" role="group" aria-label="方向键">
              <button type="button" class="pad-hit hit-up" id="pad-up" aria-label="向上移动" title="向上移动"><span aria-hidden="true">▲</span></button>
              <button type="button" class="pad-hit hit-down" id="pad-down" aria-label="向下移动" title="向下移动"><span aria-hidden="true">▼</span></button>
              <button type="button" class="pad-hit hit-left" id="pad-left" aria-label="向左移动或切换指令" title="向左"><span aria-hidden="true">◀</span></button>
              <button type="button" class="pad-hit hit-right" id="pad-right" aria-label="向右移动或切换指令" title="向右"><span aria-hidden="true">▶</span></button>
            </div>
            <div class="pad-actions">
              <button type="button" class="pad-hit hit-start" id="pad-start" aria-label="START，开始试玩" title="START · 开始或继续试玩"><span aria-hidden="true">START</span></button>
              <button type="button" class="pad-hit hit-a" id="pad-a" aria-label="A，确认" title="A · 确认"><span aria-hidden="true">A</span></button>
              <button type="button" class="pad-hit hit-b" id="pad-b" aria-label="B，返回" title="B · 返回"><span aria-hidden="true">B</span></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer><span id="footer-name">卡嗒</span><div class="footer-links"><a class="press" href="dev-notes.html">开发手记</a><a class="press" href="#games">回到卡带架</a></div></footer>
  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title"></dialog>
  <dialog id="about" class="about"><div class="viewer-head"><h2>关于卡嗒</h2><button class="icon-key press" aria-label="关闭关于" data-close><img src="icons/x-lg.svg" alt=""></button></div><p id="about-text"></p><a id="contact" hidden>联系开发者</a></dialog>
  <noscript>请启用 JavaScript 以查看插画、平台状态和作品介绍。</noscript>
</body>
</html>
